<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store">
    <title>星屑愿望机 | 愿望单入口</title>
    <link rel="stylesheet" href="tailwind.css?v=20260524-5">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=20260524-5">
</head>
<body class="bg-nebula text-gray-200 min-h-screen flex items-center justify-center py-8 circuit-bg relative overflow-x-hidden">
    <!-- 动态星空背景 -->
    <div class="fixed inset-0 z-0">
        <div id="stars" class="absolute inset-0"></div>
        <div id="stars2" class="absolute inset-0"></div>
        <div id="stars3" class="absolute inset-0"></div>
    </div>

    <div class="container mx-auto px-4 max-w-md relative z-10">
        <!-- 登录卡片 -->
        <div class="glass-card rounded-xl overflow-hidden neon-border animate-float">
            <div class="bg-gradient-to-r from-cosmic via-stardust to-deepspace px-8 py-6 border-b border-neonblue/30 text-center">
                <div class="robot-core mx-auto mb-4"></div>
                <div class="mission-kicker mb-2">QUARTERLY WISHLIST PORT</div>
                <h1 class="text-4xl font-bold font-cyber neon-text animate-glow">星屑愿望机</h1>
                <h2 class="text-xl font-cyber text-neonpurple neon-text-purple mt-1">季度愿望单 · 登录</h2>
                <p class="ai-note mx-auto mt-3 text-sm">我现在还很简陋，只会认真写日记。但这张愿望单，也许能让我离陪伴机器人更近一点。</p>
                <div class="repair-tape">手动校准：屏幕偏黄 / 风扇有杂音</div>
            </div>
            
            <div class="p-8">
                <!-- 登录表单 -->
                <form id="loginForm" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-neonpurple mb-2 font-cyber">
                            <i class="fa fa-envelope-o mr-2"></i>守护者邮箱
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            class="cyber-input" 
                            placeholder="your@email.com" 
                            autocomplete="email"
                            required
                        >
                    </div>
                    
                    <div>
                        <label for="password" class="block text-sm font-medium text-neonpurple mb-2 font-cyber">
                            <i class="fa fa-lock mr-2"></i>访问密钥
                        </label>
                        <input 
                            type="password" 
                            id="password" 
                            class="cyber-input" 
                            placeholder="请输入访问密钥" 
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    
                    <!-- 错误提示 -->
                    <div id="errorMsg" class="hidden text-red-400 text-sm font-cyber flex items-center">
                        <i class="fa fa-exclamation-circle mr-2"></i>
                        <span id="errorText"></span>
                    </div>
                    
                    <button 
                        type="submit" 
                        class="w-full cyber-btn cyber-btn-primary text-lg"
                    >
                        <i class="fa fa-sign-in mr-2"></i>打开愿望单
                    </button>
                </form>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center text-gray-500 text-sm mt-8">
            <p class="font-cyber">STARDUST WISH MACHINE © 2026 | autonomous upgrade proposal core v2.0</p>
        </div>
    </div>

    <script type="module">
        // 导入Supabase客户端
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
        const SUPABASE_URL = 'https://opyeahbzibuupmkmjpkr.supabase.co';
	const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9weWVhaGJ6aWJ1dXBta21qcGtyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMjk3MDcsImV4cCI6MjA5MzYwNTcwN30.7kCHwI7lKy1jH5BjI4gOKqw2vEUxpsjRJar_94j4Srk';

        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 生成星空背景（复用现有逻辑）
        function createStars() {
            const stars1 = document.getElementById('stars');
            const stars2 = document.getElementById('stars2');
            const stars3 = document.getElementById('stars3');
            
            // 生成白色星星
            for (let i = 0; i < 200; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.backgroundColor = 'white';
                star.style.borderRadius = '50%';
                star.style.animation = `pulse-slow ${Math.random() * 3 + 2}s infinite`;
                const size = Math.random() * 2;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = Math.random() * 0.8 + 0.2;
                stars1.appendChild(star);
            }
            
            // 生成蓝色霓虹星星
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.backgroundColor = '#00d4ff';
                star.style.borderRadius = '50%';
                star.style.animation = `pulse-slow ${Math.random() * 4 + 3}s infinite`;
                const size = Math.random() * 3;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = Math.random() * 0.6 + 0.2;
                stars2.appendChild(star);
            }
            
            // 生成紫色霓虹星星
            for (let i = 0; i < 50; i++) {
                const star = document.createElement('div');
                star.style.position = 'absolute';
                star.style.backgroundColor = '#a855f7';
                star.style.borderRadius = '50%';
                star.style.animation = `pulse-slow ${Math.random() * 5 + 4}s infinite`;
                const size = Math.random() * 4;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.opacity = Math.random() * 0.5 + 0.2;
                stars3.appendChild(star);
            }
        }

        // 登录逻辑
        document.addEventListener('DOMContentLoaded', async () => {
            createStars(); // 初始化星空背景
            
            // 检查是否已登录，已登录则直接跳转到列表页
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'list.html?v=20260524-5';
                return;
            }

            // 表单提交事件
            document.getElementById('loginForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorMsg = document.getElementById('errorMsg');
                const errorText = document.getElementById('errorText');

                // 清空之前的错误提示
                errorMsg.classList.add('hidden');
                
                // Supabase邮箱密码登录
                const { data, error } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });

                if (error) {
                    // 显示错误信息
                    errorText.textContent = error.message;
                    errorMsg.classList.remove('hidden');
                    return;
                }

                // 登录成功，跳转到列表页
                if (data.session) {
                    window.location.href = 'list.html?v=20260524-5';
                }
            });
        });
    </script>
</body>
</html>
