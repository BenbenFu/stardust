<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>星屑遥控器 - Stardust Remote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      /* 三层叠加深空背景，增加宇宙深度感 */
      background: 
        radial-gradient(ellipse at top center, #2a2a6a 0%, transparent 55%),
        radial-gradient(ellipse at bottom right, #1a1a5a 0%, transparent 50%),
        linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 30%, #0d0d2a 70%, #0a0a1a 100%);
      background-attachment: fixed;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e8ff;
      overflow-x: hidden;
      /* iPhone安全区域适配 */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* 星尘粒子背景 - 升级为随机大小亮度 */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* 流星效果 */
    .meteor {
      position: absolute;
      width: 1px;
      height: 40px;
      background: linear-gradient(to bottom, rgba(200, 220, 255, 0.9), transparent);
      transform: rotate(45deg);
      animation: meteor 3s linear forwards;
      opacity: 0;
    }

    @keyframes meteor {
      0% { transform: translateX(0) translateY(0) rotate(45deg); opacity: 1; }
      100% { transform: translateX(-300px) translateY(300px) rotate(45deg); opacity: 0; }
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 头部 - 字体层级优化 */
    .header {
      text-align: center;
      padding: 35px 0;
    }

    .logo {
      font-size: 28px;
      font-weight: 200; /* 更细的字重，更有科技感 */
      letter-spacing: 6px; /* 增加字间距 */
      color: #c8d4ff;
      text-shadow: 0 0 25px rgba(150,180,255,0.6);
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 11px;
      color: #7a8aaa;
      letter-spacing: 3px;
      text-transform: uppercase; /* 全大写更精致 */
    }

    /* 连接状态 */
    .connection-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      padding: 15px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      backdrop-filter: blur(5px);
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 10px rgba(255,77,77,0.6);
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #4dff88;
      box-shadow: 0 0 15px rgba(77,255,136,0.8);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .status-text {
      font-size: 14px;
      color: #a0b0d0;
      transition: all 0.3s ease;
    }

    /* ========== 关键修复：所有按钮统一处理 ========== */
    button {
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      outline: none;
      background: none;
      font-family: inherit;
      color: inherit;
    }

    /* 连接按钮 - 玻璃质感升级 */
    .connect-btn {
      display: block;
      width: 100%;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 3px;
      color: #ffffff;
      background: rgba(58, 74, 122, 0.6);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(150,180,255,0.3);
      border-radius: 14px;
      position: relative;
      z-index: 10;
      box-shadow: 
        0 4px 15px rgba(100, 140, 255, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .connect-btn:active {
      background: rgba(78, 94, 142, 0.7);
      transform: scale(0.97);
      box-shadow: 
        0 2px 8px rgba(100, 140, 255, 0.15),
        inset 0 2px 4px rgba(0, 0, 0, 0.2);
    }

    .connect-btn:disabled {
      opacity: 0.5;
    }

    /* 断开按钮 */
    .disconnect-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 13px;
      color: #ff6b6b;
      background: rgba(255,100,100,0.1);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,100,100,0.2);
      border-radius: 10px;
      position: relative;
      z-index: 10;
      transition: all 0.2s ease;
    }

    .disconnect-btn:active {
      background: rgba(255,100,100,0.2);
    }

    /* ========== WiFi 配网页面 - 玻璃质感统一 ========== */
    .wifi-panel {
      margin: 20px 0;
      background: rgba(30, 40, 70, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(100,140,200,0.2);
      border-radius: 16px;
      overflow: hidden;
      display: none;  /* 默认折叠 */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    .wifi-panel.show {
      display: block;
    }

    .wifi-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 20px;
      background: rgba(255,255,255,0.02);
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .wifi-panel-header:active {
      background: rgba(255,255,255,0.06);
    }

    .wifi-panel-title {
      font-size: 14px;
      color: #a0b0d0;
      letter-spacing: 1px;
    }

    .wifi-panel-arrow {
      font-size: 12px;
      color: #6a7a9a;
      transition: transform 0.3s ease;
    }

    .wifi-panel.expanded .wifi-panel-arrow {
      transform: rotate(180deg);
    }

    .wifi-panel-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    }

    .wifi-panel.expanded .wifi-panel-content {
      max-height: 500px;
      padding: 0 20px 20px;
    }

    /* WiFi 状态 */
    .wifi-status {
      padding: 12px;
      margin-bottom: 15px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      font-size: 12px;
      transition: all 0.3s ease;
    }

    .wifi-status.connected {
      background: rgba(77,255,136,0.1);
      border: 1px solid rgba(77,255,136,0.2);
    }

    .wifi-status.disconnected {
      background: rgba(255,100,100,0.1);
      border: 1px solid rgba(255,100,100,0.2);
    }

    /* WiFi 扫描按钮 */
    .wifi-scan-btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 14px;
      color: #c8d4ff;
      background: rgba(80,100,160,0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(100,140,200,0.3);
      border-radius: 10px;
      margin-bottom: 15px;
      transition: all 0.2s ease;
    }

    .wifi-scan-btn:active {
      background: rgba(80,100,160,0.6);
    }

    .wifi-scan-btn:disabled {
      opacity: 0.5;
    }

    /* WiFi 网络列表 */
    .wifi-list {
      max-height: 200px;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .wifi-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .wifi-item:active {
      background: rgba(255,255,255,0.08);
    }

    .wifi-item-info {
      flex: 1;
    }

    .wifi-item-ssid {
      font-size: 14px;
      color: #e0e8ff;
      margin-bottom: 4px;
    }

    .wifi-item-rssi {
      font-size: 11px;
      color: #6a7a9a;
    }

    .wifi-item-lock {
      font-size: 12px;
      color: #7a8aaa;
      margin-right: 10px;
    }

    /* 密码输入 */
    .wifi-password-section {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .wifi-selected-ssid {
      font-size: 14px;
      color: #c8d4ff;
      margin-bottom: 10px;
    }

    .wifi-password-input {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      color: #e0e8ff;
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      outline: none;
      margin-bottom: 12px;
      transition: border-color 0.2s ease;
    }

    .wifi-password-input:focus {
      border-color: rgba(100,140,200,0.5);
    }

    .wifi-password-input::placeholder {
      color: #5a6a8a;
    }

    .wifi-connect-btn {
      display: block;
      width: 100%;
      padding: 14px;
      font-size: 14px;
      color: #ffffff;
      background: rgba(74, 106, 154, 0.6);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(100,140,200,0.3);
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .wifi-connect-btn:active {
      background: rgba(94, 126, 174, 0.7);
    }

    .wifi-connect-btn:disabled {
      opacity: 0.5;
    }

    /* WiFi 操作按钮 */
    .wifi-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }

    .wifi-action-btn {
      flex: 1;
      padding: 10px;
      font-size: 12px;
      color: #a0b0d0;
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(5px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .wifi-action-btn:active {
      background: rgba(255,255,255,0.1);
    }

    .wifi-action-btn.clear {
      color: #ff6b6b;
      background: rgba(255,100,100,0.1);
      border-color: rgba(255,100,100,0.2);
    }

    .wifi-action-btn.clear:active {
      background: rgba(255,100,100,0.2);
    }

    /* 扫描中状态 */
    .wifi-scanning {
      text-align: center;
      padding: 20px;
      color: #7a8aaa;
      font-size: 13px;
    }

    .wifi-scanning::after {
      content: '';
      display: inline-block;
      width: 16px;
      height: 16px;
      margin-left: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #a0b0d0;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 状态卡片 - 玻璃质感升级 */
    .status-card {
      margin: 30px 0;
      padding: 25px;
      background: rgba(40, 50, 90, 0.4);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(100,140,200,0.2);
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .diary-counter {
      font-size: 42px;
      font-weight: 200;
      color: #fff;
      text-shadow: 0 0 30px rgba(150,180,255,0.4);
      transition: all 0.3s ease;
    }

    .diary-counter span {
      font-size: 20px;
      color: #6a7a9a;
      margin: 0 5px;
    }

    .scroll-state {
      margin-top: 15px;
      padding: 8px 20px;
      display: inline-block;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
      transition: all 0.3s ease;
    }

    .scroll-state.scrolling {
      background: rgba(77,255,136,0.15);
      color: #4dff88;
      border: 1px solid rgba(77,255,136,0.3);
    }

    .scroll-state.paused {
      background: rgba(255,200,77,0.15);
      color: #ffc84d;
      border: 1px solid rgba(255,200,77,0.3);
    }

    .scroll-state.idle {
      background: rgba(150,160,200,0.15);
      color: #a0b0d0;
      border: 1px solid rgba(150,160,200,0.3);
    }

    /* 控制按钮组 - 玻璃质感升级 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: auto;
      padding-bottom: 30px;
    }

    .control-btn {
      padding: 22px 12px; /* 扩大点击区域 */
      font-size: 28px;
      background: rgba(50, 60, 100, 0.4);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(100,140,200,0.2);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      z-index: 1;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .control-btn .icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px rgba(150,180,255,0.4));
    }

    .control-btn .label {
      font-size: 9px;
      color: #7a8aaa;
      letter-spacing: 2px;
      text-transform: uppercase; /* 全大写更精致 */
    }

    .control-btn:active:not(:disabled) {
      transform: scale(0.96);
      background: rgba(80, 95, 150, 0.7);
    }

    .control-btn:disabled {
      opacity: 0.4;
    }

    .control-btn.primary {
      background: rgba(60, 80, 140, 0.5);
    }

    .control-btn.primary:active:not(:disabled) {
      background: rgba(80, 110, 180, 0.7);
    }

    /* 浏览器提示 */
    .browser-hint {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #5a6a8a;
    }

    /* 调试日志 */
    .debug-log {
      margin-top: 15px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-size: 11px;
      color: #6a8a6a;
      max-height: 80px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="container">
    <div class="header">
      <div class="logo">✧ STARDUST ✧</div>
      <div class="subtitle">星屑化身遥控器</div>
    </div>

    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">未连接</span>
    </div>

    <button class="connect-btn" id="connectBtn" onclick="handleConnect()">
      ⚡ 连接星屑
    </button>
    <button class="disconnect-btn" id="disconnectBtn" style="display:none;" onclick="handleDisconnect()">
      断开连接
    </button>

    <!-- WiFi 配网页面 -->
    <div class="wifi-panel" id="wifiPanel">
      <div class="wifi-panel-header" onclick="toggleWifiPanel()">
        <span class="wifi-panel-title">📶 WiFi 配网</span>
        <span class="wifi-panel-arrow">▼</span>
      </div>
      <div class="wifi-panel-content">
        <div class="wifi-status" id="wifiStatus">
          <div id="wifiStatusText">点击"扫描WiFi"开始配置</div>
        </div>
        
        <button class="wifi-scan-btn" id="wifiScanBtn" onclick="scanWiFi()">
          🔍 扫描 WiFi
        </button>
        
        <div class="wifi-list" id="wifiList"></div>
        
        <div class="wifi-password-section" id="wifiPasswordSection" style="display:none;">
          <div class="wifi-selected-ssid" id="selectedSSID">已选择: ---</div>
          <input type="password" class="wifi-password-input" id="wifiPassword" placeholder="输入WiFi密码">
          <button class="wifi-connect-btn" id="wifiConnectBtn" onclick="connectWiFi()">
            连接并保存
          </button>
        </div>
        
        <div class="wifi-actions">
          <button class="wifi-action-btn" onclick="checkWiFiStatus()">📡 状态</button>
          <button class="wifi-action-btn clear" onclick="clearWiFi()">🗑 清除</button>
        </div>
      </div>
    </div>

    <div class="status-card">
      <div class="diary-counter">
        <span id="currentDiary">--</span><span>/</span><span id="totalDiary">--</span>
      </div>
      <div class="scroll-state idle" id="scrollState">空闲中</div>
    </div>

    <div class="controls">
      <button class="control-btn" id="btnPrev" disabled onclick="sendCmd('PREV')">
        <span class="icon">⏮</span>
        <span class="label">PREV</span>
      </button>
      
      <button class="control-btn primary" id="btnSync" disabled onclick="sendCmd('SYNC')">
        <span class="icon">🔄</span>
        <span class="label">SYNC</span>
      </button>
      
      <button class="control-btn" id="btnNext" disabled onclick="sendCmd('NEXT')">
        <span class="icon">⏭</span>
        <span class="label">NEXT</span>
      </button>
      
      <button class="control-btn" id="btnStop" disabled onclick="sendCmd('STOP')">
        <span class="icon">⏸</span>
        <span class="label">STOP</span>
      </button>
      
      <button class="control-btn primary" id="btnPlay" disabled onclick="sendCmd('PLAY')">
        <span class="icon">▶</span>
        <span class="label">PLAY</span>
      </button>
    </div>

    <div class="browser-hint">
      iOS请使用 Bluefy 浏览器<br>
      Android/桌面使用 Chrome 或 Edge
    </div>

    <div class="debug-log" id="debugLog"></div>
  </div>

  <script>
    // ===== 调试日志 =====
    function dbg(msg) {
      console.log('[Stardust] ' + msg);
      var el = document.getElementById('debugLog');
      if (el) {
        el.style.display = 'block';
        el.innerHTML += msg + '<br>';
        el.scrollTop = el.scrollHeight;
      }
    }

    // ===== BLE 配置 =====
    var BLE_SERVICE_UUID = '0000fe40-0000-1000-8000-00805f9b34fb';
    var BLE_CMD_CHAR_UUID = '0000fe41-0000-1000-8000-00805f9b34fb';
    var BLE_STATUS_CHAR_UUID = '0000fe42-0000-1000-8000-00805f9b34fb';

    // BLE 状态
    var bleDevice = null;
    var bleServer = null;
    var cmdChar = null;
    var statusChar = null;
    var isConnected = false;

    // WiFi 配网状态
    var wifiNetworks = [];
    var selectedSSID = null;
    var pendingSSID = null;
    var pendingPassword = null;

    // ===== 星尘背景 + 流星效果 =====
    (function createStars() {
      try {
        var c = document.getElementById('stars');
        for (var i = 0; i < 60; i++) {
          var s = document.createElement('div');
          s.className = 'star';
          // 随机大小和位置
          var size = 1 + Math.random() * 2;
          s.style.width = size + 'px';
          s.style.height = size + 'px';
          s.style.left = Math.random() * 100 + '%';
          s.style.top = Math.random() * 100 + '%';
          s.style.animationDelay = Math.random() * 3 + 's';
          s.style.animationDuration = (2 + Math.random() * 3) + 's';
          s.style.opacity = 0.3 + Math.random() * 0.7;
          c.appendChild(s);
        }

        // 随机生成流星
        setInterval(() => {
          if (Math.random() > 0.7) {
            const meteor = document.createElement('div');
            meteor.className = 'meteor';
            meteor.style.left = Math.random() * 100 + '%';
            meteor.style.top = '-40px';
            meteor.style.animationDuration = (2 + Math.random() * 2) + 's';
            c.appendChild(meteor);
            setTimeout(() => meteor.remove(), 4000);
          }
        }, 5000);

      } catch(e) {
        dbg('Stars error: ' + e.message);
      }
    })();

    // ===== WiFi 配网页面切换 =====
    function toggleWifiPanel() {
      var panel = document.getElementById('wifiPanel');
      panel.classList.toggle('expanded');
    }

    // ===== WiFi 状态显示 =====
    function updateWiFiStatus(type, msg) {
      var statusEl = document.getElementById('wifiStatus');
      var textEl = document.getElementById('wifiStatusText');
      
      statusEl.className = 'wifi-status';
      if (type === 'connected') {
        statusEl.classList.add('connected');
      } else if (type === 'disconnected' || type === 'error') {
        statusEl.classList.add('disconnected');
      }
      
      textEl.textContent = msg || '';
      dbg('WiFi Status: ' + type + ' - ' + msg);
    }

    // ===== WiFi 命令发送 =====
    function sendWiFiCmd(cmd) {
      if (!isConnected || !cmdChar) {
        dbg('未连接，无法发送WiFi命令: ' + cmd);
        return;
      }
      var encoder = new TextEncoder();
      cmdChar.writeValue(encoder.encode(cmd))
      .then(function() {
        dbg('WiFi命令已发送: ' + cmd);
      })
      .catch(function(err) {
        dbg('WiFi命令发送失败: ' + err.message);
      });
    }

    // ===== 扫描 WiFi =====
    function scanWiFi() {
      if (!isConnected) {
        alert('请先连接设备');
        return;
      }
      
      var scanBtn = document.getElementById('wifiScanBtn');
      var listEl = document.getElementById('wifiList');
      
      scanBtn.disabled = true;
      scanBtn.textContent = '🔍 扫描中...';
      listEl.innerHTML = '<div class="wifi-scanning">正在搜索附近的WiFi...</div>';
      
      sendWiFiCmd('WIFI:SCAN');
    }

    // ===== 处理 WiFi 扫描结果 =====
    function handleWiFiScanResult(data) {
      var scanBtn = document.getElementById('wifiScanBtn');
      var listEl = document.getElementById('wifiList');
      
      scanBtn.disabled = false;
      scanBtn.textContent = '🔍 扫描 WiFi';
      
      if (data.networks && data.networks.length > 0) {
        wifiNetworks = data.networks;
        renderWiFiList(data.networks);
        updateWiFiStatus('info', '找到 ' + data.networks.length + ' 个网络');
      } else {
        listEl.innerHTML = '<div style="text-align:center;padding:20px;color:#6a7a9a;">未找到WiFi网络</div>';
        updateWiFiStatus('info', '未找到WiFi网络');
      }
    }

    // ===== 渲染 WiFi 列表 =====
    function renderWiFiList(networks) {
      var listEl = document.getElementById('wifiList');
      listEl.innerHTML = '';
      
      // 按信号强度排序
      networks.sort(function(a, b) {
        return b.rssi - a.rssi;
      });
      
      networks.forEach(function(net) {
        var item = document.createElement('div');
        item.className = 'wifi-item';
        item.onclick = function() { selectWiFi(net.ssid); };
        
        var rssiPercent = Math.max(0, Math.min(100, (net.rssi + 100) * 2));
        var lockIcon = net.encrypted ? '🔒' : '';
        
        item.innerHTML = 
          '<div class="wifi-item-info">' +
            '<div class="wifi-item-ssid">' + escapeHtml(net.ssid) + '</div>' +
            '<div class="wifi-item-rssi">信号: ' + rssiPercent + '%</div>' +
          '</div>' +
          '<span class="wifi-item-lock">' + lockIcon + '</span>';
        
        listEl.appendChild(item);
      });
    }

    // ===== 选择 WiFi =====
    function selectWiFi(ssid) {
      selectedSSID = ssid;
      pendingSSID = ssid;
      
      var pwdSection = document.getElementById('wifiPasswordSection');
      var ssidEl = document.getElementById('selectedSSID');
      var pwdInput = document.getElementById('wifiPassword');
      
      pwdSection.style.display = 'block';
      ssidEl.textContent = '已选择: ' + ssid;
      pwdInput.value = '';
      pwdInput.focus();
      
      sendWiFiCmd('WIFI:SET_SSID:' + ssid);
      dbg('已选择WiFi: ' + ssid);
    }

    // ===== 连接 WiFi =====
    function connectWiFi() {
      if (!isConnected) {
        alert('请先连接设备');
        return;
      }
      
      var ssid = pendingSSID || selectedSSID;
      var password = document.getElementById('wifiPassword').value;
      
      if (!ssid) {
        alert('请先选择WiFi网络');
        return;
      }
      
      if (!password) {
        alert('请输入WiFi密码');
        return;
      }
      
      var connectBtn = document.getElementById('wifiConnectBtn');
      connectBtn.disabled = true;
      connectBtn.textContent = '连接中...';
      
      pendingPassword = password;
      
      sendWiFiCmd('WIFI:SET_PASS:' + password);
      
      setTimeout(function() {
        sendWiFiCmd('WIFI:CONNECT');
      }, 100);
    }

    // ===== 检查 WiFi 状态 =====
    function checkWiFiStatus() {
      if (!isConnected) {
        alert('请先连接设备');
        return;
      }
      sendWiFiCmd('WIFI:STATUS');
    }

    // ===== 清除 WiFi 凭据 =====
    function clearWiFi() {
      if (!isConnected) {
        alert('请先连接设备');
        return;
      }
      if (confirm('确定要清除保存的WiFi凭据吗？')) {
        sendWiFiCmd('WIFI:CLEAR');
        selectedSSID = null;
        pendingSSID = null;
        pendingPassword = null;
        
        var pwdSection = document.getElementById('wifiPasswordSection');
        pwdSection.style.display = 'none';
        
        updateWiFiStatus('disconnected', '凭据已清除');
      }
    }

    // ===== 处理 WiFi 状态通知 =====
    function handleWiFiStatus(data) {
      var connectBtn = document.getElementById('wifiConnectBtn');
      connectBtn.disabled = false;
      connectBtn.textContent = '连接并保存';
      
      if (data.wifi === 'connected') {
        updateWiFiStatus('connected', '已连接! IP: ' + (data.ip || '成功'));
        selectedSSID = null;
        pendingSSID = null;
        pendingPassword = null;
        
        var pwdSection = document.getElementById('wifiPasswordSection');
        pwdSection.style.display = 'none';
        
        // 3秒后自动折叠WiFi面板
        setTimeout(function() {
          var panel = document.getElementById('wifiPanel');
          panel.classList.remove('expanded');
        }, 3000);
        
      } else if (data.wifi === 'failed') {
        updateWiFiStatus('error', '连接失败: ' + (data.msg || '密码错误或信号弱'));
        
      } else if (data.wifi === 'ssid_set') {
        updateWiFiStatus('info', 'SSID已设置');
        
      } else if (data.wifi === 'password_set') {
        updateWiFiStatus('info', '密码已设置');
        
      } else if (data.wifi === 'connecting') {
        updateWiFiStatus('info', '正在连接...');
        
      } else if (data.wifi === 'scanning') {
        updateWiFiStatus('info', '正在扫描WiFi...');
        
      } else if (data.wifi === 'scan_done') {
        handleWiFiScanResult(data);
        
      } else if (data.wifi === 'scan_cont') {
        if (data.networks) {
          wifiNetworks = wifiNetworks.concat(data.networks);
        }
        
      } else if (data.wifi === 'disconnected') {
        updateWiFiStatus('disconnected', data.saved ? '未连接（已有凭据）' : '未连接（无凭据）');
        
      } else if (data.wifi === 'cleared') {
        updateWiFiStatus('info', '凭据已清除');
        
      } else if (data.wifi === 'error') {
        updateWiFiStatus('error', data.msg || '未知错误');
        
      } else {
        dbg('WiFi状态: ' + JSON.stringify(data));
      }
    }

    // ===== HTML转义 =====
    function escapeHtml(text) {
      var div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== 连接函数 =====
    function handleConnect() {
      dbg('按钮被点击！');
      var bt = navigator.bluetooth || window.bluetooth;
      if (!bt) {
        alert('浏览器不支持蓝牙，请用 Bluefy 或 Chrome');
        return;
      }
      dbg('蓝牙API可用，开始扫描...');
      bt.requestDevice({
        filters: [{ namePrefix: 'Stardust' }],
        optionalServices: [BLE_SERVICE_UUID]
      })
      .then(function(device) {
        dbg('发现设备: ' + device.name);
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', function() {
          dbg('设备断开');
          onBleDisconnect();
        });
        return device.gatt.connect();
      })
      .then(function(server) {
        dbg('GATT已连接');
        bleServer = server;
        return server.getPrimaryService(BLE_SERVICE_UUID);
      })
      .then(function(service) {
        dbg('找到服务');
        return Promise.all([
          service.getCharacteristic(BLE_CMD_CHAR_UUID),
          service.getCharacteristic(BLE_STATUS_CHAR_UUID)
        ]);
      })
      .then(function(chars) {
        cmdChar = chars[0];
        statusChar = chars[1];
        dbg('特征值已获取');
        return statusChar.startNotifications();
      })
      .then(function() {
        statusChar.addEventListener('characteristicvaluechanged', onStatusNotify);
        isConnected = true;
        onBleConnect();
        dbg('连接成功！');
        
        setTimeout(function() {
          checkWiFiStatus();
        }, 500);
      })
      .catch(function(err) {
        dbg('连接失败: ' + err.message);
        alert('连接失败: ' + err.message);
      });
    }

    function handleDisconnect() {
      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      isConnected = false;
      onBleDisconnect();
      
      wifiNetworks = [];
      selectedSSID = null;
      pendingSSID = null;
      pendingPassword = null;
      
      var pwdSection = document.getElementById('wifiPasswordSection');
      pwdSection.style.display = 'none';
      
      var wifiList = document.getElementById('wifiList');
      wifiList.innerHTML = '';
    }

    function sendCmd(cmd) {
      if (!isConnected || !cmdChar) {
        dbg('未连接，无法发送: ' + cmd);
        return;
      }
      var encoder = new TextEncoder();
      cmdChar.writeValue(encoder.encode(cmd))
      .then(function() {
        dbg('已发送: ' + cmd);
      })
      .catch(function(err) {
        dbg('发送失败: ' + err.message);
      });
    }

    // ===== 状态回调 =====
    function onBleConnect() {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = '已连接';
      document.getElementById('connectBtn').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'block';
      
      var wifiPanel = document.getElementById('wifiPanel');
      wifiPanel.classList.add('show');
      
      var btns = document.querySelectorAll('.control-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
    }

    function onBleDisconnect() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = '未连接';
      document.getElementById('connectBtn').style.display = 'block';
      document.getElementById('disconnectBtn').style.display = 'none';
      
      var wifiPanel = document.getElementById('wifiPanel');
      wifiPanel.classList.remove('show');
      wifiPanel.classList.remove('expanded');
      
      var btns = document.querySelectorAll('.control-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      document.getElementById('currentDiary').textContent = '--';
      document.getElementById('totalDiary').textContent = '--';
      document.getElementById('scrollState').className = 'scroll-state idle';
      document.getElementById('scrollState').textContent = '空闲中';
    }

    function onStatusNotify(event) {
      var value = event.target.value;
      var decoder = new TextDecoder();
      var jsonStr = decoder.decode(value);
      dbg('状态: ' + jsonStr);
      
      try {
        var data = JSON.parse(jsonStr);
        
        if (data.wifi !== undefined) {
          handleWiFiStatus(data);
          return;
        }
        
        document.getElementById('currentDiary').textContent = (data.diary !== undefined && data.diary !== null) ? data.diary + 1 : '--';
        document.getElementById('totalDiary').textContent = data.total || '--';
        var stateEl = document.getElementById('scrollState');
        if (data.state === 'scrolling' || data.scrolling === true) {
          stateEl.className = 'scroll-state scrolling';
          stateEl.textContent = '滚动中';
        } else if (data.state === 'paused') {
          stateEl.className = 'scroll-state paused';
          stateEl.textContent = '已暂停';
        } else {
          stateEl.className = 'scroll-state idle';
          stateEl.textContent = '空闲中';
        }
      } catch(e) {
        dbg('解析失败: ' + e.message);
      }
    }

    // ===== iOS触摸事件兜底 =====
    document.addEventListener('DOMContentLoaded', function() {
      dbg('DOM就绪');
      var connectBtn = document.getElementById('connectBtn');
      connectBtn.addEventListener('touchstart', function(e) {
        dbg('touchstart触发！');
      }, {passive: true});
      connectBtn.addEventListener('click', function() {
        dbg('click事件触发！');
      });
    });
  </script>
</body>
</html>
