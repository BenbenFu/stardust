<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星屑遥控器 - Stardust Remote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 30%, #0d0d2a 70%, #0a0a1a 100%);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #e0e8ff;
      overflow-x: hidden;
    }

    /* 星尘粒子背景 */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px; height: 2px;
      background: rgba(255,255,255,0.8);
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 头部 */
    .header {
      text-align: center;
      padding: 30px 0;
    }

    .logo {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #c8d4ff;
      text-shadow: 0 0 20px rgba(150,180,255,0.5);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #7a8aaa;
      letter-spacing: 2px;
    }

    /* 连接状态 */
    .connection-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      padding: 15px 20px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
    }

    .status-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 10px rgba(255,77,77,0.6);
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #4dff88;
      box-shadow: 0 0 15px rgba(77,255,136,0.8);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .status-text {
      font-size: 14px;
      color: #a0b0d0;
    }

    /* ========== 关键修复：所有按钮统一处理 ========== */
    button {
      /* 确保iOS可点击 */
      cursor: pointer;
      touch-action: manipulation;
      -webkit-appearance: none;
      appearance: none;
      border: none;
      outline: none;
      background: none;
      font-family: inherit;
      color: inherit;
    }

    /* 连接按钮 */
    .connect-btn {
      display: block;
      width: 100%;
      padding: 18px 30px;
      font-size: 18px;
      font-weight: 500;
      letter-spacing: 3px;
      color: #ffffff;
      background: linear-gradient(135deg, #3a4a7a, #2a3a6a);
      border: 1px solid rgba(150,180,255,0.3);
      border-radius: 14px;
      /* 关键：确保按钮自身有定位上下文，不被其他元素遮挡 */
      position: relative;
      z-index: 10;
    }

    .connect-btn:active {
      background: linear-gradient(135deg, #5a6a9a, #4a5a8a);
      transform: scale(0.97);
    }

    .connect-btn:disabled {
      opacity: 0.5;
    }

    /* 断开按钮 */
    .disconnect-btn {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      font-size: 13px;
      color: #ff6b6b;
      background: rgba(255,100,100,0.1);
      border: 1px solid rgba(255,100,100,0.2);
      border-radius: 10px;
      position: relative;
      z-index: 10;
    }

    /* 状态卡片 */
    .status-card {
      margin: 30px 0;
      padding: 25px;
      background: linear-gradient(145deg, rgba(40,50,90,0.6), rgba(30,40,80,0.8));
      border: 1px solid rgba(100,140,200,0.2);
      border-radius: 16px;
      text-align: center;
    }

    .diary-counter {
      font-size: 42px;
      font-weight: 200;
      color: #fff;
      text-shadow: 0 0 30px rgba(150,180,255,0.4);
    }

    .diary-counter span {
      font-size: 20px;
      color: #6a7a9a;
      margin: 0 5px;
    }

    .scroll-state {
      margin-top: 15px;
      padding: 8px 20px;
      display: inline-block;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .scroll-state.scrolling {
      background: rgba(77,255,136,0.15);
      color: #4dff88;
      border: 1px solid rgba(77,255,136,0.3);
    }

    .scroll-state.paused {
      background: rgba(255,200,77,0.15);
      color: #ffc84d;
      border: 1px solid rgba(255,200,77,0.3);
    }

    .scroll-state.idle {
      background: rgba(150,160,200,0.15);
      color: #a0b0d0;
      border: 1px solid rgba(150,160,200,0.3);
    }

    /* 控制按钮组 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: auto;
      padding-bottom: 30px;
    }

    .control-btn {
      padding: 20px 10px;
      font-size: 28px;
      background: linear-gradient(145deg, rgba(50,60,100,0.6), rgba(40,50,90,0.8));
      border: 1px solid rgba(100,140,200,0.2);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      /* 关键修复：position: relative 让::before定位在按钮内而非container */
      position: relative;
      overflow: hidden;
      z-index: 1;
    }

    .control-btn .icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px rgba(150,180,255,0.4));
    }

    .control-btn .label {
      font-size: 10px;
      color: #7a8aaa;
      letter-spacing: 1px;
    }

    .control-btn:active:not(:disabled) {
      transform: scale(0.95);
      background: linear-gradient(145deg, rgba(70,85,140,0.7), rgba(60,75,130,0.9));
    }

    .control-btn:disabled {
      opacity: 0.4;
    }

    .control-btn.primary {
      background: linear-gradient(145deg, rgba(60,80,140,0.7), rgba(50,70,120,0.9));
    }

    /* 浏览器提示 */
    .browser-hint {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #5a6a8a;
    }

    /* 调试日志（开发阶段可见） */
    .debug-log {
      margin-top: 15px;
      padding: 10px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      font-size: 11px;
      color: #6a8a6a;
      max-height: 80px;
      overflow-y: auto;
      display: none;
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="container">
    <div class="header">
      <div class="logo">✧ STARDUST ✧</div>
      <div class="subtitle">星屑化身遥控器</div>
    </div>

    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">未连接</span>
    </div>

    <!-- 三重保障：inline onclick + addEventListener + touchstart -->
    <button class="connect-btn" id="connectBtn" onclick="handleConnect()">
      ⚡ 连接星屑
    </button>

    <button class="disconnect-btn" id="disconnectBtn" style="display:none;" onclick="handleDisconnect()">
      断开连接
    </button>

    <div class="status-card">
      <div class="diary-counter">
        <span id="currentDiary">--</span><span>/</span><span id="totalDiary">--</span>
      </div>
      <div class="scroll-state idle" id="scrollState">空闲中</div>
    </div>

    <div class="controls">
      <button class="control-btn" id="btnPrev" disabled onclick="sendCmd('PREV')">
        <span class="icon">⏮</span>
        <span class="label">PREV</span>
      </button>
      <button class="control-btn primary" id="btnSync" disabled onclick="sendCmd('SYNC')">
        <span class="icon">🔄</span>
        <span class="label">SYNC</span>
      </button>
      <button class="control-btn" id="btnNext" disabled onclick="sendCmd('NEXT')">
        <span class="icon">⏭</span>
        <span class="label">NEXT</span>
      </button>
      <button class="control-btn" id="btnStop" disabled onclick="sendCmd('STOP')">
        <span class="icon">⏸</span>
        <span class="label">STOP</span>
      </button>
      <button class="control-btn primary" id="btnPlay" disabled onclick="sendCmd('PLAY')">
        <span class="icon">▶</span>
        <span class="label">PLAY</span>
      </button>
    </div>

    <div class="browser-hint">
      iOS请使用 Bluefy 浏览器<br>
      Android/桌面使用 Chrome 或 Edge
    </div>

    <div class="debug-log" id="debugLog"></div>
  </div>

  <script>
    // ===== 最先执行的验证：JS是否在跑 =====
    alert('星屑遥控器已加载！');

    // ===== 调试日志 =====
    function dbg(msg) {
      console.log('[Stardust] ' + msg);
      var el = document.getElementById('debugLog');
      if (el) {
        el.style.display = 'block';
        el.innerHTML += msg + '<br>';
        el.scrollTop = el.scrollHeight;
      }
    }

    // ===== BLE 配置 =====
    var BLE_SERVICE_UUID = '0000fe40-0000-1000-8000-00805f9b34fb';
    var BLE_CMD_CHAR_UUID = '0000fe41-0000-1000-8000-00805f9b34fb';
    var BLE_STATUS_CHAR_UUID = '0000fe42-0000-1000-8000-00805f9b34fb';

    // BLE 状态
    var bleDevice = null;
    var bleServer = null;
    var cmdChar = null;
    var statusChar = null;
    var isConnected = false;

    // ===== 星尘背景 =====
    (function createStars() {
      try {
        var c = document.getElementById('stars');
        for (var i = 0; i < 50; i++) {
          var s = document.createElement('div');
          s.className = 'star';
          s.style.left = Math.random() * 100 + '%';
          s.style.top = Math.random() * 100 + '%';
          s.style.animationDelay = Math.random() * 3 + 's';
          s.style.animationDuration = (2 + Math.random() * 3) + 's';
          c.appendChild(s);
        }
      } catch(e) {
        dbg('Stars error: ' + e.message);
      }
    })();

    // ===== 连接函数（全局，供inline onclick调用） =====
    function handleConnect() {
      dbg('按钮被点击！');
      alert('正在搜索星屑...');

      var bt = navigator.bluetooth || window.bluetooth;
      if (!bt) {
        alert('浏览器不支持蓝牙，请用 Bluefy 或 Chrome');
        return;
      }

      dbg('蓝牙API可用，开始扫描...');

      bt.requestDevice({
        filters: [{ namePrefix: 'Stardust' }],
        optionalServices: [BLE_SERVICE_UUID]
      })
      .then(function(device) {
        dbg('发现设备: ' + device.name);
        bleDevice = device;
        bleDevice.addEventListener('gattserverdisconnected', function() {
          dbg('设备断开');
          onBleDisconnect();
        });
        return device.gatt.connect();
      })
      .then(function(server) {
        dbg('GATT已连接');
        bleServer = server;
        return server.getPrimaryService(BLE_SERVICE_UUID);
      })
      .then(function(service) {
        dbg('找到服务');
        return Promise.all([
          service.getCharacteristic(BLE_CMD_CHAR_UUID),
          service.getCharacteristic(BLE_STATUS_CHAR_UUID)
        ]);
      })
      .then(function(chars) {
        cmdChar = chars[0];
        statusChar = chars[1];
        dbg('特征值已获取');

        // 订阅状态通知
        return statusChar.startNotifications();
      })
      .then(function() {
        statusChar.addEventListener('characteristicvaluechanged', onStatusNotify);
        isConnected = true;
        onBleConnect();
        dbg('连接成功！');
      })
      .catch(function(err) {
        dbg('连接失败: ' + err.message);
        alert('连接失败: ' + err.message);
      });
    }

    function handleDisconnect() {
      if (bleDevice && bleDevice.gatt && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      isConnected = false;
      onBleDisconnect();
    }

    function sendCmd(cmd) {
      if (!isConnected || !cmdChar) {
        dbg('未连接，无法发送: ' + cmd);
        return;
      }
      var encoder = new TextEncoder();
      cmdChar.writeValue(encoder.encode(cmd))
      .then(function() {
        dbg('已发送: ' + cmd);
      })
      .catch(function(err) {
        dbg('发送失败: ' + err.message);
      });
    }

    // ===== 状态回调 =====
    function onBleConnect() {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = '已连接';
      document.getElementById('connectBtn').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'block';
      var btns = document.querySelectorAll('.control-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = false;
    }

    function onBleDisconnect() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = '未连接';
      document.getElementById('connectBtn').style.display = 'block';
      document.getElementById('disconnectBtn').style.display = 'none';
      var btns = document.querySelectorAll('.control-btn');
      for (var i = 0; i < btns.length; i++) btns[i].disabled = true;
      document.getElementById('currentDiary').textContent = '--';
      document.getElementById('totalDiary').textContent = '--';
      document.getElementById('scrollState').className = 'scroll-state idle';
      document.getElementById('scrollState').textContent = '空闲中';
    }

    function onStatusNotify(event) {
      var value = event.target.value;
      var decoder = new TextDecoder();
      var jsonStr = decoder.decode(value);
      dbg('状态: ' + jsonStr);
      try {
        var s = JSON.parse(jsonStr);
        document.getElementById('currentDiary').textContent = s.diary || '--';
        document.getElementById('totalDiary').textContent = s.total || '--';
        var stateEl = document.getElementById('scrollState');
        if (s.state === 'scrolling') {
          stateEl.className = 'scroll-state scrolling';
          stateEl.textContent = '滚动中';
        } else if (s.state === 'paused') {
          stateEl.className = 'scroll-state paused';
          stateEl.textContent = '已暂停';
        } else {
          stateEl.className = 'scroll-state idle';
          stateEl.textContent = '空闲中';
        }
      } catch(e) {
        dbg('解析失败: ' + e.message);
      }
    }

    // ===== 额外绑定touchstart（iOS兼容） =====
    document.addEventListener('DOMContentLoaded', function() {
      dbg('DOM就绪');

      var connectBtn = document.getElementById('connectBtn');
      // touchstart兜底
      connectBtn.addEventListener('touchstart', function(e) {
        dbg('touchstart触发！');
      }, {passive: true});

      // addEventListener兜底
      connectBtn.addEventListener('click', function() {
        dbg('click事件触发！');
      });
    });
  </script>
</body>
</html>
