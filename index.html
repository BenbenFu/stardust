<title>星屑遥控器 - Stardust Remote</title>

<style>

* {

margin: 0;

padding: 0;

box-sizing: border-box;

-webkit-tap-highlight-color: transparent;

}

body {

min-height: 100vh;

background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 30%, #0d0d2a 70%, #0a0a1a 100%);

font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;

color: #e0e8ff;

overflow-x: hidden;

}

/* 星尘粒子背景 */

.stars {

position: fixed;

top: 0; left: 0;

width: 100%; height: 100%;

pointer-events: none;

z-index: 0;

}

.star {

position: absolute;

width: 2px; height: 2px;

background: rgba(255,255,255,0.8);

border-radius: 50%;

animation: twinkle 3s infinite ease-in-out;

}

@keyframes twinkle {

0%, 100% { opacity: 0.3; transform: scale(1); }

50% { opacity: 1; transform: scale(1.5); }

}

/* 主容器 */

.container {

position: relative;

z-index: 1;

max-width: 480px;

margin: 0 auto;

padding: 20px;

min-height: 100vh;

display: flex;

flex-direction: column;

}

/* 头部 */

.header {

text-align: center;

padding: 30px 0;

}

.logo {

font-size: 28px;

font-weight: 300;

letter-spacing: 4px;

color: #c8d4ff;

text-shadow: 0 0 20px rgba(150,180,255,0.5);

margin-bottom: 8px;

}

.subtitle {

font-size: 12px;

color: #7a8aaa;

letter-spacing: 2px;

}

/* 连接状态 */

.connection-status {

display: flex;

align-items: center;

justify-content: center;

gap: 10px;

margin: 20px 0;

padding: 15px 20px;

background: rgba(255,255,255,0.03);

border: 1px solid rgba(255,255,255,0.08);

border-radius: 12px;

}

.status-dot {

width: 10px; height: 10px;

border-radius: 50%;

background: #ff4d4d;

box-shadow: 0 0 10px rgba(255,77,77,0.6);

animation: pulse 2s infinite;

}

.status-dot.connected {

background: #4dff88;

box-shadow: 0 0 15px rgba(77,255,136,0.8);

}

@keyframes pulse {

0%, 100% { opacity: 1; }

50% { opacity: 0.6; }

}

.status-text {

font-size: 14px;

color: #a0b0d0;

}

/* ========== 关键修复：所有按钮统一处理 ========== /

button {

/ 确保iOS可点击 */

cursor: pointer;

touch-action: manipulation;

-webkit-appearance: none;

appearance: none;

border: none;

outline: none;

background: none;

font-family: inherit;

color: inherit;

}

/* 连接按钮 /

.connect-btn {

display: block;

width: 100%;

padding: 18px 30px;

font-size: 18px;

font-weight: 500;

letter-spacing: 3px;

color: #ffffff;

background: linear-gradient(135deg, #3a4a7a, #2a3a6a);

border: 1px solid rgba(150,180,255,0.3);

border-radius: 14px;

/ 关键：确保按钮自身有定位上下文，不被其他元素遮挡 */

position: relative;

z-index: 10;

}

.connect-btn:active {

background: linear-gradient(135deg, #5a6a9a, #4a5a8a);

transform: scale(0.97);

}

.connect-btn:disabled {

opacity: 0.5;

}

/* 断开按钮 */

.disconnect-btn {

display: block;

width: 100%;

margin-top: 12px;

padding: 12px;

font-size: 13px;

color: #ff6b6b;

background: rgba(255,100,100,0.1);

border: 1px solid rgba(255,100,100,0.2);

border-radius: 10px;

position: relative;

z-index: 10;

}

/* 状态卡片 */

.status-card {

margin: 30px 0;

padding: 25px;

background: linear-gradient(145deg, rgba(40,50,90,0.6), rgba(30,40,80,0.8));

border: 1px solid rgba(100,140,200,0.2);

border-radius: 16px;

text-align: center;

}

.diary-counter {

font-size: 42px;

font-weight: 200;

color: #fff;

text-shadow: 0 0 30px rgba(150,180,255,0.4);

}

.diary-counter span {

font-size: 20px;

color: #6a7a9a;

margin: 0 5px;

}

.scroll-state {

margin-top: 15px;

padding: 8px 20px;

display: inline-block;

border-radius: 20px;

font-size: 13px;

letter-spacing: 1px;

}

.scroll-state.scrolling {

background: rgba(77,255,136,0.15);

color: #4dff88;

border: 1px solid rgba(77,255,136,0.3);

}

.scroll-state.paused {

background: rgba(255,200,77,0.15);

color: #ffc84d;

border: 1px solid rgba(255,200,77,0.3);

}

.scroll-state.idle {

background: rgba(150,160,200,0.15);

color: #a0b0d0;

border: 1px solid rgba(150,160,200,0.3);

}

/* 控制按钮组 */

.controls {

display: grid;

grid-template-columns: repeat(3, 1fr);

gap: 12px;

margin-top: auto;

padding-bottom: 30px;

}

.control-btn {

padding: 20px 10px;

font-size: 28px;

background: linear-gradient(145deg, rgba(50,60,100,0.6), rgba(40,50,90,0.8));

border: 1px solid rgba(100,140,200,0.2);

border-radius: 14px;

display: flex;

flex-direction: column;

align-items: center;

gap: 6px;

/* 关键修复：position: relative 让::before定位在按钮内而非container */

position: relative;

overflow: hidden;

z-index: 1;

}

.control-btn .icon {

font-size: 26px;

filter: drop-shadow(0 0 8px rgba(150,180,255,0.4));

}

.control-btn .label {

font-size: 10px;

color: #7a8aaa;

letter-spacing: 1px;

}

.control-btn:active:not(:disabled) {

transform: scale(0.95);

background: linear-gradient(145deg, rgba(70,85,140,0.7), rgba(60,75,130,0.9));

}

.control-btn:disabled {

opacity: 0.4;

}

.control-btn.primary {

background: linear-gradient(145deg, rgba(60,80,140,0.7), rgba(50,70,120,0.9));

}

/* 浏览器提示 */

.browser-hint {

text-align: center;

margin-top: 20px;

font-size: 11px;

color: #5a6a8a;

}

/* 调试日志（开发阶段可见） */

.debug-log {

margin-top: 15px;

padding: 10px;

background: rgba(0,0,0,0.3);

border-radius: 8px;

font-size: 11px;

color: #6a8a6a;

max-height: 80px;

overflow-y: auto;

display: none;

}

</style>

<script>

plaintext
// ===== &#x8C03;&#x8BD5;&#x65E5;&#x5FD7; =====
function dbg(msg) {
  console.log(&#x27;[Stardust] &#x27; + msg);
  var el = document.getElementById(&#x27;debugLog&#x27;);
  if (el) {
    el.style.display = &#x27;block&#x27;;
    el.innerHTML += msg + &#x27;&#x3C;br&#x3E;&#x27;;
    el.scrollTop = el.scrollHeight;
  }
}

// ===== BLE &#x914D;&#x7F6E; =====
var BLE_SERVICE_UUID = &#x27;0000fe40-0000-1000-8000-00805f9b34fb&#x27;;
var BLE_CMD_CHAR_UUID = &#x27;0000fe41-0000-1000-8000-00805f9b34fb&#x27;;
var BLE_STATUS_CHAR_UUID = &#x27;0000fe42-0000-1000-8000-00805f9b34fb&#x27;;

// BLE &#x72B6;&#x6001;
var bleDevice = null;
var bleServer = null;
var cmdChar = null;
var statusChar = null;
var isConnected = false;

// ===== &#x661F;&#x5C18;&#x80CC;&#x666F; =====
(function createStars() {
  try {
    var c = document.getElementById(&#x27;stars&#x27;);
    for (var i = 0; i &#x3C; 50; i++) {
      var s = document.createElement(&#x27;div&#x27;);
      s.className = &#x27;star&#x27;;
      s.style.left = Math.random() * 100 + &#x27;%&#x27;;
      s.style.top = Math.random() * 100 + &#x27;%&#x27;;
      s.style.animationDelay = Math.random() * 3 + &#x27;s&#x27;;
      s.style.animationDuration = (2 + Math.random() * 3) + &#x27;s&#x27;;
      c.appendChild(s);
    }
  } catch(e) {
    dbg(&#x27;Stars error: &#x27; + e.message);
  }
})();

// ===== &#x8FDE;&#x63A5;&#x51FD;&#x6570;&#xFF08;&#x5168;&#x5C40;&#xFF0C;&#x4F9B;inline onclick&#x8C03;&#x7528;&#xFF09; =====
function handleConnect() {
  dbg(&#x27;&#x6309;&#x94AE;&#x88AB;&#x70B9;&#x51FB;&#xFF01;&#x27;);
  alert(&#x27;&#x6B63;&#x5728;&#x641C;&#x7D22;&#x661F;&#x5C51;...&#x27;);

  var bt = navigator.bluetooth || window.bluetooth;
  if (!bt) {
    alert(&#x27;&#x6D4F;&#x89C8;&#x5668;&#x4E0D;&#x652F;&#x6301;&#x84DD;&#x7259;&#xFF0C;&#x8BF7;&#x7528; Bluefy &#x6216; Chrome&#x27;);
    return;
  }

  dbg(&#x27;&#x84DD;&#x7259;API&#x53EF;&#x7528;&#xFF0C;&#x5F00;&#x59CB;&#x626B;&#x63CF;...&#x27;);

  bt.requestDevice({
    filters: [{ namePrefix: &#x27;Stardust&#x27; }],
    optionalServices: [BLE_SERVICE_UUID]
  })
  .then(function(device) {
    dbg(&#x27;&#x53D1;&#x73B0;&#x8BBE;&#x5907;: &#x27; + device.name);
    bleDevice = device;
    bleDevice.addEventListener(&#x27;gattserverdisconnected&#x27;, function() {
      dbg(&#x27;&#x8BBE;&#x5907;&#x65AD;&#x5F00;&#x27;);
      onBleDisconnect();
    });
    return device.gatt.connect();
  })
  .then(function(server) {
    dbg(&#x27;GATT&#x5DF2;&#x8FDE;&#x63A5;&#x27;);
    bleServer = server;
    return server.getPrimaryService(BLE_SERVICE_UUID);
  })
  .then(function(service) {
    dbg(&#x27;&#x627E;&#x5230;&#x670D;&#x52A1;&#x27;);
    return Promise.all([
      service.getCharacteristic(BLE_CMD_CHAR_UUID),
      service.getCharacteristic(BLE_STATUS_CHAR_UUID)
    ]);
  })
  .then(function(chars) {
    cmdChar = chars[0];
    statusChar = chars[1];
    dbg(&#x27;&#x7279;&#x5F81;&#x503C;&#x5DF2;&#x83B7;&#x53D6;&#x27;);

    // &#x8BA2;&#x9605;&#x72B6;&#x6001;&#x901A;&#x77E5;
    return statusChar.startNotifications();
  })
  .then(function() {
    statusChar.addEventListener(&#x27;characteristicvaluechanged&#x27;, onStatusNotify);
    isConnected = true;
    onBleConnect();
    dbg(&#x27;&#x8FDE;&#x63A5;&#x6210;&#x529F;&#xFF01;&#x27;);
  })
  .catch(function(err) {
    dbg(&#x27;&#x8FDE;&#x63A5;&#x5931;&#x8D25;: &#x27; + err.message);
    alert(&#x27;&#x8FDE;&#x63A5;&#x5931;&#x8D25;: &#x27; + err.message);
  });
}

function handleDisconnect() {
  if (bleDevice &#x26;&#x26; bleDevice.gatt &#x26;&#x26; bleDevice.gatt.connected) {
    bleDevice.gatt.disconnect();
  }
  isConnected = false;
  onBleDisconnect();
}

function sendCmd(cmd) {
  if (!isConnected || !cmdChar) {
    dbg(&#x27;&#x672A;&#x8FDE;&#x63A5;&#xFF0C;&#x65E0;&#x6CD5;&#x53D1;&#x9001;: &#x27; + cmd);
    return;
  }
  var encoder = new TextEncoder();
  cmdChar.writeValue(encoder.encode(cmd))
  .then(function() {
    dbg(&#x27;&#x5DF2;&#x53D1;&#x9001;: &#x27; + cmd);
  })
  .catch(function(err) {
    dbg(&#x27;&#x53D1;&#x9001;&#x5931;&#x8D25;: &#x27; + err.message);
  });
}

// ===== &#x72B6;&#x6001;&#x56DE;&#x8C03; =====
function onBleConnect() {
  document.getElementById(&#x27;statusDot&#x27;).classList.add(&#x27;connected&#x27;);
  document.getElementById(&#x27;statusText&#x27;).textContent = &#x27;&#x5DF2;&#x8FDE;&#x63A5;&#x27;;
  document.getElementById(&#x27;connectBtn&#x27;).style.display = &#x27;none&#x27;;
  document.getElementById(&#x27;disconnectBtn&#x27;).style.display = &#x27;block&#x27;;
  var btns = document.querySelectorAll(&#x27;.control-btn&#x27;);
  for (var i = 0; i &#x3C; btns.length; i++) btns[i].disabled = false;
}

function onBleDisconnect() {
  document.getElementById(&#x27;statusDot&#x27;).classList.remove(&#x27;connected&#x27;);
  document.getElementById(&#x27;statusText&#x27;).textContent = &#x27;&#x672A;&#x8FDE;&#x63A5;&#x27;;
  document.getElementById(&#x27;connectBtn&#x27;).style.display = &#x27;block&#x27;;
  document.getElementById(&#x27;disconnectBtn&#x27;).style.display = &#x27;none&#x27;;
  var btns = document.querySelectorAll(&#x27;.control-btn&#x27;);
  for (var i = 0; i &#x3C; btns.length; i++) btns[i].disabled = true;
  document.getElementById(&#x27;currentDiary&#x27;).textContent = &#x27;--&#x27;;
  document.getElementById(&#x27;totalDiary&#x27;).textContent = &#x27;--&#x27;;
  document.getElementById(&#x27;scrollState&#x27;).className = &#x27;scroll-state idle&#x27;;
  document.getElementById(&#x27;scrollState&#x27;).textContent = &#x27;&#x7A7A;&#x95F2;&#x4E2D;&#x27;;
}

function onStatusNotify(event) {
  var value = event.target.value;
  var decoder = new TextDecoder();
  var jsonStr = decoder.decode(value);
  dbg(&#x27;&#x72B6;&#x6001;: &#x27; + jsonStr);
  try {
    var s = JSON.parse(jsonStr);
    document.getElementById(&#x27;currentDiary&#x27;).textContent = s.diary || &#x27;--&#x27;;
    document.getElementById(&#x27;totalDiary&#x27;).textContent = s.total || &#x27;--&#x27;;
    var stateEl = document.getElementById(&#x27;scrollState&#x27;);
    if (s.state === &#x27;scrolling&#x27;) {
      stateEl.className = &#x27;scroll-state scrolling&#x27;;
      stateEl.textContent = &#x27;&#x6EDA;&#x52A8;&#x4E2D;&#x27;;
    } else if (s.state === &#x27;paused&#x27;) {
      stateEl.className = &#x27;scroll-state paused&#x27;;
      stateEl.textContent = &#x27;&#x5DF2;&#x6682;&#x505C;&#x27;;
    } else {
      stateEl.className = &#x27;scroll-state idle&#x27;;
      stateEl.textContent = &#x27;&#x7A7A;&#x95F2;&#x4E2D;&#x27;;
    }
  } catch(e) {
    dbg(&#x27;&#x89E3;&#x6790;&#x5931;&#x8D25;: &#x27; + e.message);
  }
}

// ===== &#x989D;&#x5916;&#x7ED1;&#x5B9A;touchstart&#xFF08;iOS&#x517C;&#x5BB9;&#xFF09; =====
document.addEventListener(&#x27;DOMContentLoaded&#x27;, function() {
  dbg(&#x27;DOM&#x5C31;&#x7EEA;&#x27;);

  var connectBtn = document.getElementById(&#x27;connectBtn&#x27;);
  // touchstart&#x515C;&#x5E95;
  connectBtn.addEventListener(&#x27;touchstart&#x27;, function(e) {
    dbg(&#x27;touchstart&#x89E6;&#x53D1;&#xFF01;&#x27;);
  }, {passive: true});

  // addEventListener&#x515C;&#x5E95;
  connectBtn.addEventListener(&#x27;click&#x27;, function() {
    dbg(&#x27;click&#x4E8B;&#x4EF6;&#x89E6;&#x53D1;&#xFF01;&#x27;);
  });
});


</script>
