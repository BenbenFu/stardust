<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stardust Remote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #060816;
      --bg-2: #0c1026;
      --card: rgba(20, 26, 50, 0.72);
      --card-strong: rgba(32, 42, 78, 0.92);
      --line: rgba(180, 210, 255, 0.12);
      --line-strong: rgba(180, 210, 255, 0.24);
      --text: #edf2ff;
      --sub: #8e9bc6;
      --blue: #8cb6ff;
      --blue-2: #5e84ff;
      --green: #6fffc2;
      --red: #ff7d90;
      --yellow: #ffd37a;
      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --blur: blur(18px);
      --radius: 24px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top, rgba(82,120,255,.22), transparent 30%),
        radial-gradient(circle at bottom right, rgba(110,255,215,.08), transparent 28%),
        linear-gradient(160deg, var(--bg-1), var(--bg-2));
      color: var(--text);
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 90%);
      pointer-events: none;
      opacity: .3;
    }

    .stars {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle linear infinite;
      opacity: .7;
    }

    @keyframes twinkle {
      0%,100% { opacity: .15; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.6); }
    }

    .orb {
      position: fixed;
      width: 380px;
      height: 380px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .22;
      z-index: 0;
      pointer-events: none;
    }

    .orb.one {
      background: #5b7cff;
      top: -120px;
      left: -80px;
    }

    .orb.two {
      background: #5effd0;
      bottom: -160px;
      right: -100px;
    }

    .container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 22px 18px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      gap: 18px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 32px;
      padding: 32px 26px;
      background: linear-gradient(145deg, rgba(22,30,58,.88), rgba(12,16,34,.92));
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: var(--blur);
    }

    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top right, rgba(140,182,255,.16), transparent 28%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .logo-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 54px;
      height: 54px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, rgba(113,146,255,.28), rgba(255,255,255,.04));
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: inset 0 0 24px rgba(255,255,255,.05);
      font-size: 22px;
    }

    .logo {
      font-size: 1.45rem;
      font-weight: 600;
      letter-spacing: .12em;
    }

    .subtitle {
      color: var(--sub);
      font-size: .82rem;
      margin-top: 4px;
      letter-spacing: .18em;
    }

    .signal {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.06);
      font-size: .82rem;
      color: var(--sub);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px rgba(255,125,144,.7);
      animation: pulse 2s infinite;
    }

    .dot.connected {
      background: var(--green);
      box-shadow: 0 0 18px rgba(111,255,194,.8);
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: .5; }
    }

    .hero-main {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .stats-card {
      position: relative;
      border-radius: 26px;
      padding: 28px;
      background: linear-gradient(145deg, rgba(34,44,80,.72), rgba(18,22,40,.82));
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .stats-card::after {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(130,170,255,.22), transparent 70%);
    }

    .stats-label {
      color: var(--sub);
      font-size: .82rem;
      letter-spacing: .18em;
      margin-bottom: 14px;
    }

    .counter {
      display: flex;
      align-items: baseline;
      gap: 10px;
      font-weight: 300;
      line-height: 1;
    }

    .counter .big {
      font-size: 4.5rem;
      text-shadow: 0 0 40px rgba(140,182,255,.28);
    }

    .counter .slash,
    .counter .total {
      color: var(--sub);
      font-size: 1.6rem;
    }

    .state-chip {
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.04);
      color: var(--sub);
      font-size: .82rem;
      letter-spacing: .12em;
    }

    .state-chip.scrolling {
      color: var(--green);
      background: rgba(111,255,194,.12);
      border-color: rgba(111,255,194,.22);
    }

    .state-chip.paused {
      color: var(--yellow);
      background: rgba(255,211,122,.12);
      border-color: rgba(255,211,122,.22);
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      border: none;
      outline: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      transition: .22s ease;
      -webkit-appearance: none;
      appearance: none;
      touch-action: manipulation;
    }

    .connect-btn {
      position: relative;
      overflow: hidden;
      width: 100%;
      border-radius: 22px;
      padding: 20px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: .16em;
      background: linear-gradient(135deg, #6f95ff, #5f7fff 55%, #4f66d9);
      color: white;
      box-shadow:
        0 12px 30px rgba(95,127,255,.36),
        inset 0 0 18px rgba(255,255,255,.12);
    }

    .connect-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent, rgba(255,255,255,.24), transparent);
      transform: translateX(-120%);
    }

    .connect-btn:hover::before {
      transform: translateX(120%);
      transition: 1s;
    }

    .connect-btn:active {
      transform: scale(.98);
    }

    .disconnect-btn {
      width: 100%;
      padding: 14px;
      border-radius: 18px;
      background: rgba(255,125,144,.12);
      border: 1px solid rgba(255,125,144,.18);
      color: var(--red);
      display: none;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .control-btn {
      position: relative;
      overflow: hidden;
      min-height: 110px;
      border-radius: 24px;
      background: var(--card);
      backdrop-filter: var(--blur);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .control-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, rgba(140,182,255,.16), transparent 60%);
      opacity: 0;
      transition: .25s ease;
    }

    .control-btn:hover::before {
      opacity: 1;
    }

    .control-btn:active {
      transform: scale(.96);
    }

    .control-btn:disabled {
      opacity: .38;
    }

    .control-btn.primary {
      background: linear-gradient(145deg, rgba(65,92,190,.4), rgba(28,34,58,.92));
      border-color: rgba(140,182,255,.18);
    }

    .control-icon {
      width: 34px;
      height: 34px;
      color: #edf2ff;
      filter: drop-shadow(0 0 12px rgba(140,182,255,.24));
      transition: .22s ease;
    }

    .control-btn:hover .control-icon {
      transform: scale(1.08);
    }

    .play-btn .control-icon {
      transform: translateX(1px);
    }

    .rotate-icon {
      animation: slowRotate 10s linear infinite;
    }

    @keyframes slowRotate {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .label {
      font-size: .72rem;
      color: var(--sub);
      letter-spacing: .16em;
    }

    .wifi-panel {
      display: none;
      border-radius: 28px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: var(--blur);
    }

    .wifi-panel.show {
      display: block;
    }

    .wifi-panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px;
      cursor: pointer;
    }

    .wifi-panel-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: .92rem;
      letter-spacing: .12em;
      color: #dce5ff;
    }

    .wifi-panel-arrow {
      color: var(--sub);
      transition: .3s ease;
    }

    .wifi-panel.expanded .wifi-panel-arrow {
      transform: rotate(180deg);
    }

    .wifi-panel-content {
      display: none;
      padding: 0 22px 22px;
    }

    .wifi-panel.expanded .wifi-panel-content {
      display: block;
    }

    .wifi-status {
      padding: 16px;
      border-radius: 18px;
      margin-bottom: 16px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      color: var(--sub);
      font-size: .88rem;
    }

    .wifi-status.connected {
      background: rgba(111,255,194,.1);
      border-color: rgba(111,255,194,.18);
      color: var(--green);
    }

    .wifi-status.disconnected {
      background: rgba(255,125,144,.08);
      border-color: rgba(255,125,144,.18);
      color: var(--red);
    }

    .wifi-scan-btn,
    .wifi-connect-btn,
    .wifi-action-btn {
      width: 100%;
      border-radius: 16px;
      padding: 14px;
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.06);
      color: #dce5ff;
    }

    .wifi-connect-btn {
      margin-top: 12px;
      background: linear-gradient(135deg, #6f95ff, #5f7fff);
      border: none;
    }

    .wifi-list {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 240px;
      overflow-y: auto;
    }

    .wifi-item {
      padding: 14px;
      border-radius: 16px;
      background: rgba(255,255,255,.03);
      border: 1px solid rgba(255,255,255,.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .wifi-item:active {
      transform: scale(.98);
    }

    .wifi-item-ssid {
      font-size: .92rem;
      margin-bottom: 4px;
    }

    .wifi-item-rssi {
      font-size: .74rem;
      color: var(--sub);
    }

    .wifi-password-section {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid rgba(255,255,255,.06);
      display: none;
    }

    .wifi-password-input {
      width: 100%;
      margin-top: 12px;
      border-radius: 16px;
      padding: 15px;
      background: rgba(0,0,0,.22);
      border: 1px solid rgba(255,255,255,.08);
      color: white;
    }

    .wifi-password-input:focus {
      border-color: rgba(140,182,255,.42);
      box-shadow: 0 0 0 4px rgba(140,182,255,.08);
    }

    .wifi-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .panel-title-icon {
      width: 18px;
      height: 18px;
      color: #9fc0ff;
    }

    .btn-inline-icon {
      width: 16px;
      height: 16px;
      margin-right: 8px;
      vertical-align: -3px;
    }

    .wifi-lock-icon {
      width: 16px;
      height: 16px;
      color: #8e9bc6;
    }

    .wifi-action-btn.clear {
      color: var(--red);
      background: rgba(255,125,144,.08);
      border-color: rgba(255,125,144,.16);
    }

    .footer {
      text-align: center;
      color: var(--sub);
      font-size: .74rem;
      line-height: 1.8;
      padding-bottom: 10px;
      opacity: .8;
    }

    .debug-log {
      max-height: 200px;
      overflow-y: auto;
      background: rgba(0,0,0,.55);
      color: #8fbc8f;
      font-family: monospace;
      font-size: .68rem;
      line-height: 1.6;
      padding: 8px 10px;
      border-radius: 8px;
      margin-top: 12px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    @media (max-width: 420px) {
      .container {
        padding: 16px 14px 34px;
      }

      .hero {
        padding: 24px 20px;
      }

      .counter .big {
        font-size: 3.7rem;
      }

      .controls {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="orb one"></div>
  <div class="orb two"></div>

  <div class="container">

    <section class="hero">

      <div class="hero-top">
        <div class="logo-wrap">
          <div class="logo-icon">✦</div>

          <div>
            <div class="logo">STARDUST</div>
            <div class="subtitle">星屑遥控器</div>
          </div>
        </div>

        <div class="signal">
          <div class="dot" id="statusDot"></div>
          <span id="statusText">未连接</span>
        </div>
      </div>

      <div class="hero-main">

        <div class="stats-card">
          <div class="stats-label">CURRENT RECORD</div>

          <div class="counter">
            <div class="big" id="currentDiary">--</div>
            <div class="slash">/</div>
            <div class="total" id="totalDiary">--</div>
          </div>

          <div class="state-chip idle" id="scrollState">
            ✦ 空闲中
          </div>
        </div>

        <div class="buttons">
          <button class="connect-btn" id="connectBtn" onclick="handleConnect()">
            ⚡ CONNECT TO STARDUST
          </button>

          <button class="disconnect-btn" id="disconnectBtn" onclick="handleDisconnect()">
            断开连接
          </button>
        </div>

      </div>
    </section>

    <section class="wifi-panel" id="wifiPanel">
      <div class="wifi-panel-header" onclick="toggleWifiPanel()">
        <div class="wifi-panel-title"><svg class="panel-title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4.5 9.5C8.8 5.8 15.2 5.8 19.5 9.5"/><path d="M7.5 12.5C10.1 10.3 13.9 10.3 16.5 12.5"/><path d="M10.5 15.5C11.3 14.9 12.7 14.9 13.5 15.5"/><circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/></svg><span>WIFI CONFIGURATION</span></div>
        <div class="wifi-panel-arrow">▼</div>
      </div>

      <div class="wifi-panel-content">

        <div class="wifi-status" id="wifiStatus">
          <div id="wifiStatusText">点击“扫描 WiFi”开始配置</div>
        </div>

        <button class="wifi-scan-btn" id="wifiScanBtn" onclick="scanWiFi()">
          <svg class="btn-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20L16.5 16.5"/></svg>扫描 WiFi
        </button>

        <div class="wifi-list" id="wifiList"></div>

        <div class="wifi-password-section" id="wifiPasswordSection">
          <div class="wifi-selected-ssid" id="selectedSSID">已选择：---</div>

          <input
            type="password"
            class="wifi-password-input"
            id="wifiPassword"
            placeholder="输入 WiFi 密码"
          >

          <button class="wifi-connect-btn" id="wifiConnectBtn" onclick="connectWiFi()">
            连接并保存
          </button>
        </div>

        <div class="wifi-actions">
          <button class="wifi-action-btn" onclick="checkWiFiStatus()">
            <svg class="btn-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 18h.01"/><path d="M8.5 14.5a5 5 0 0 1 7 0"/><path d="M5 11a10 10 0 0 1 14 0"/></svg>状态
          </button>

          <button class="wifi-action-btn clear" onclick="clearWiFi()">
            <svg class="btn-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7H20"/><path d="M9 7V4H15V7"/><path d="M7 7L8 19H16L17 7"/></svg>清除
          </button>
        </div>

      </div>
    </section>

    <section class="controls">

      <button class="control-btn" id="btnPrev" disabled onclick="sendCmd('PREV')">
        <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M11 6L5 12L11 18"/>
          <path d="M19 6L13 12L19 18"/>
        </svg>
        <div class="label">PREV</div>
      </button>

      <button class="control-btn primary play-btn" id="btnPlay" disabled onclick="sendCmd('PLAY')">
        <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 6L18 12L8 18Z"/>
        </svg>
        <div class="label">PLAY</div>
      </button>

      <button class="control-btn" id="btnNext" disabled onclick="sendCmd('NEXT')">
        <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M5 6L11 12L5 18"/>
          <path d="M13 6L19 12L13 18"/>
        </svg>
        <div class="label">NEXT</div>
      </button>

      <button class="control-btn primary" id="btnSync" disabled onclick="sendCmd('SYNC')">
        <svg class="control-icon rotate-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M20 12A8 8 0 1 1 17.3 6"/>
          <path d="M20 4V10H14"/>
        </svg>
        <div class="label">SYNC</div>
      </button>

      <button class="control-btn" id="btnStop" disabled onclick="sendCmd('STOP')">
        <svg class="control-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="7" y="7" width="10" height="10" rx="1.5"/>
        </svg>
        <div class="label">STOP</div>
      </button>

      <button class="control-btn" id="btnMode" disabled onclick="sendCmd('MODE')">
        <svg class="control-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M6 5.5H18"/>
          <path d="M6 9.5H18"/>
          <path d="M8 14L12 18L16 14"/>
        </svg>
        <div class="label" id="modeLabel">ANSWERS</div>
      </button>

    </section>

    <div class="footer">
      iOS 推荐使用 Bluefy 浏览器<br>
      Android / 桌面端推荐 Chrome 或 Edge
    </div>

    <div class="debug-log" id="debugLog"></div>
  </div>

  <script>
    // 星空背景
    (function createStars() {
      const container = document.getElementById('stars');

      for (let i = 0; i < 70; i++) {
        const star = document.createElement('div');
        star.className = 'star';

        const size = Math.random() * 2.8 + .6;

        star.style.width = size + 'px';
        star.style.height = size + 'px';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDuration = (2 + Math.random() * 5) + 's';
        star.style.animationDelay = Math.random() * 5 + 's';

        container.appendChild(star);
      }
    })();

    // ===== 调试日志 =====
    var _dbgEl = null;
    function dbg(msg) {
      console.log('[Stardust] ' + msg);
      _dbgEl = _dbgEl || document.getElementById('debugLog');
      if (_dbgEl) {
        var line = document.createElement('div');
        line.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
        _dbgEl.appendChild(line);
        _dbgEl.scrollTop = _dbgEl.scrollHeight;
      }
    }

    // ===== BLE 配置 =====
    var BLE_SERVICE_UUID = '0000fe40-0000-1000-8000-00805f9b34fb';
    var BLE_CMD_CHAR_UUID = '0000fe41-0000-1000-8000-00805f9b34fb';
    var BLE_STATUS_CHAR_UUID = '0000fe42-0000-1000-8000-00805f9b34fb';

    var bleDevice = null;
    var bleServer = null;
    var cmdChar = null;
    var statusChar = null;
    var isConnected = false;

    var wifiNetworks = [];
    var selectedSSID = null;

    function toggleWifiPanel() {
      document.getElementById('wifiPanel').classList.toggle('expanded');
    }

    function updateWiFiStatus(type, msg) {
      const statusEl = document.getElementById('wifiStatus');
      const textEl = document.getElementById('wifiStatusText');

      statusEl.className = 'wifi-status';

      if (type === 'connected') {
        statusEl.classList.add('connected');
      }

      if (type === 'error' || type === 'disconnected') {
        statusEl.classList.add('disconnected');
      }

      textEl.textContent = msg;
    }

    function sendWiFiCmd(cmd) {
      if (!isConnected || !cmdChar) return;

      const encoder = new TextEncoder();

      cmdChar.writeValue(encoder.encode(cmd))
      .then(() => dbg('WiFi CMD: ' + cmd))
      .catch(err => dbg(err.message));
    }

    function scanWiFi() {
      if (!isConnected) {
        alert('请先连接设备');
        return;
      }

      const scanBtn = document.getElementById('wifiScanBtn');
      const listEl = document.getElementById('wifiList');

      scanBtn.disabled = true;
      scanBtn.textContent = '扫描中...';

      listEl.innerHTML = '<div style="padding:20px;text-align:center;color:#8e9bc6;">正在扫描附近网络...</div>';

      wifiNetworks = [];  // ★ 修复：扫描前重置列表
      sendWiFiCmd('WIFI:SCAN');
    }

    function renderWiFiList(networks) {
      const listEl = document.getElementById('wifiList');

      listEl.innerHTML = '';

      networks.sort((a,b)=>b.rssi-a.rssi);

      networks.forEach(net => {
        const item = document.createElement('div');

        item.className = 'wifi-item';

        item.innerHTML = `
          <div>
            <div class="wifi-item-ssid">${net.ssid}</div>
            <div class="wifi-item-rssi">信号强度 ${Math.max(0,Math.min(100,(net.rssi+100)*2))}%</div>
          </div>
          <div>${net.secure ? '<svg class="wifi-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="11" width="12" height="9" rx="2"/><path d="M9 11V8a3 3 0 0 1 6 0v3"/></svg>' : ''}</div>
        `;

        item.onclick = () => selectWiFi(net.ssid);

        listEl.appendChild(item);
      });
    }

    function selectWiFi(ssid) {
      selectedSSID = ssid;

      document.getElementById('wifiPasswordSection').style.display = 'block';
      document.getElementById('selectedSSID').textContent = '已选择：' + ssid;

      sendWiFiCmd('WIFI:SET_SSID:' + ssid);
    }

    function connectWiFi() {
      if (!selectedSSID) {
        alert('请先选择 WiFi');
        return;
      }

      const password = document.getElementById('wifiPassword').value;

      if (!password) {
        alert('请输入密码');
        return;
      }

      sendWiFiCmd('WIFI:SET_PASS:' + password);

      setTimeout(() => {
        sendWiFiCmd('WIFI:CONNECT');
      }, 120);
    }

    function checkWiFiStatus() {
      sendWiFiCmd('WIFI:STATUS');
    }

    function clearWiFi() {
      sendWiFiCmd('WIFI:CLEAR');
    }

    function handleConnect() {
      const bt = navigator.bluetooth || window.bluetooth;

      if (!bt) {
        alert('浏览器不支持蓝牙，请使用 Bluefy / Chrome');
        return;
      }

      bt.requestDevice({
        filters: [{ namePrefix: 'Stardust' }],
        optionalServices: [BLE_SERVICE_UUID]
      })
      .then(device => {
        bleDevice = device;

        bleDevice.addEventListener('gattserverdisconnected', onBleDisconnect);

        return device.gatt.connect();
      })
      .then(server => {
        bleServer = server;
        return server.getPrimaryService(BLE_SERVICE_UUID);
      })
      .then(service => {
        return Promise.all([
          service.getCharacteristic(BLE_CMD_CHAR_UUID),
          service.getCharacteristic(BLE_STATUS_CHAR_UUID)
        ]);
      })
      .then(chars => {
        cmdChar = chars[0];
        statusChar = chars[1];

        return statusChar.startNotifications();
      })
      .then(() => {
        statusChar.addEventListener('characteristicvaluechanged', onStatusNotify);

        isConnected = true;

        onBleConnect();

        setTimeout(() => {
          checkWiFiStatus();
        }, 500);
      })
      .catch(err => {
        alert('连接失败：' + err.message);
      });
    }

    function handleDisconnect() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }

      isConnected = false;

      onBleDisconnect();
    }

    function sendCmd(cmd) {
      if (!isConnected || !cmdChar) return;

      const encoder = new TextEncoder();

      cmdChar.writeValue(encoder.encode(cmd));
    }

    function onBleConnect() {
      document.getElementById('statusDot').classList.add('connected');
      document.getElementById('statusText').textContent = '已连接';

      document.getElementById('connectBtn').style.display = 'none';
      document.getElementById('disconnectBtn').style.display = 'block';

      document.getElementById('wifiPanel').classList.add('show');

      document.querySelectorAll('.control-btn').forEach(btn => {
        btn.disabled = false;
      });
    }

    function onBleDisconnect() {
      document.getElementById('statusDot').classList.remove('connected');
      document.getElementById('statusText').textContent = '未连接';

      document.getElementById('connectBtn').style.display = 'block';
      document.getElementById('disconnectBtn').style.display = 'none';

      document.getElementById('wifiPanel').classList.remove('show');
      document.getElementById('wifiPanel').classList.remove('expanded');

      document.querySelectorAll('.control-btn').forEach(btn => {
        btn.disabled = true;
      });
    }

    function onStatusNotify(event) {
      const value = event.target.value;
      const decoder = new TextDecoder();

      const jsonStr = decoder.decode(value);
      dbg('Notify raw (' + jsonStr.length + '): ' + jsonStr.substring(0, 120));

      try {
        const data = JSON.parse(jsonStr);

        if (data.wifi !== undefined) {

          if (data.wifi === 'connected') {
            updateWiFiStatus('connected', 'WiFi 已连接');
          }

          else if (data.wifi === 'failed') {
            updateWiFiStatus('error', '连接失败');
          }

          else if (data.wifi === 'scan_done') {
            document.getElementById('wifiScanBtn').disabled = false;
            document.getElementById('wifiScanBtn').innerHTML = '<svg class="btn-inline-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20L16.5 16.5"/></svg>扫描 WiFi';
            wifiNetworks = data.networks || [];
            renderWiFiList(wifiNetworks);
          }

          else if (data.wifi === 'scan_cont') {
            if (data.networks) {
              wifiNetworks = wifiNetworks.concat(data.networks);
              renderWiFiList(wifiNetworks);
            }
          }

          return;
        }

        document.getElementById('currentDiary').textContent = data.diary !== undefined
          ? data.diary + 1
          : '--';

        document.getElementById('totalDiary').textContent = data.total || '--';

        // 模式适配
        var mode = data.mode || 'diary';
        var modeLabel = document.getElementById('modeLabel');
        var stateEl = document.getElementById('scrollState');
        var btnSync = document.getElementById('btnSync');
        var btnStop = document.getElementById('btnStop');

        if (mode === 'menu') {
          // 菜单模式
          modeLabel.textContent = 'MENU';
          stateEl.className = 'state-chip idle';
          stateEl.innerHTML = '✦ 菜单';
          btnSync.style.display = 'none';
          btnStop.style.display = 'none';
        } else if (mode === 'answers') {
          // 答案之书模式
          modeLabel.textContent = 'MENU';
          stateEl.className = 'state-chip idle';
          stateEl.innerHTML = '✦ 答案之书';
          btnSync.style.display = 'none';
          btnStop.style.display = 'none';
        } else {
          // 日记模式
          modeLabel.textContent = 'ANSWERS';
          btnSync.style.display = '';
          btnStop.style.display = '';

          if (data.state === 'scrolling') {
            stateEl.className = 'state-chip scrolling';
            stateEl.innerHTML = '✦ 滚动中';
          }
          else if (data.state === 'paused') {
            stateEl.className = 'state-chip paused';
            stateEl.innerHTML = '✦ 已暂停';
          }
          else {
            stateEl.className = 'state-chip idle';
            stateEl.innerHTML = '✦ 空闲中';
          }
        }
      }

      catch(e) {
        dbg('JSON parse failed: ' + e.message + ' | raw: ' + jsonStr.substring(0, 200));
      }
    }
  </script>
</body>
</html>
