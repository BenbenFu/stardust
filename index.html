<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>星屑遥控器 - Stardust Remote</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a3a 30%, #0d0d2a 70%, #0a0a1a 100%);
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #e0e8ff;
      overflow-x: hidden;
      position: relative;
    }

    /* 星尘粒子背景 */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.5); }
    }

    /* 主容器 */
    .container {
      position: relative;
      z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 连接状态头部 */
    .header {
      text-align: center;
      padding: 30px 0;
    }

    .logo {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: 4px;
      color: #c8d4ff;
      text-shadow: 0 0 20px rgba(150, 180, 255, 0.5);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px;
      color: #7a8aaa;
      letter-spacing: 2px;
    }

    /* 连接状态指示器 */
    .connection-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 20px 0;
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ff4d4d;
      box-shadow: 0 0 10px rgba(255, 77, 77, 0.6);
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #4dff88;
      box-shadow: 0 0 15px rgba(77, 255, 136, 0.8);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.9); }
    }

    .status-text {
      font-size: 14px;
      color: #a0b0d0;
    }

    /* 连接按钮 */
    .connect-btn {
      width: 100%;
      padding: 16px 30px;
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 2px;
      color: #ffffff;
      background: linear-gradient(135deg, #3a4a7a 0%, #2a3a6a 100%);
      border: 1px solid rgba(150, 180, 255, 0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
    }

    .connect-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #4a5a9a 0%, #3a4a8a 100%);
      box-shadow: 0 0 30px rgba(100, 140, 255, 0.3);
      transform: translateY(-2px);
    }

    .connect-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* 当前状态卡片 */
    .status-card {
      margin: 30px 0;
      padding: 25px;
      background: linear-gradient(145deg, rgba(40, 50, 90, 0.6), rgba(30, 40, 80, 0.8));
      border: 1px solid rgba(100, 140, 200, 0.2);
      border-radius: 16px;
      text-align: center;
    }

    .diary-counter {
      font-size: 42px;
      font-weight: 200;
      color: #ffffff;
      text-shadow: 0 0 30px rgba(150, 180, 255, 0.4);
    }

    .diary-counter span {
      font-size: 20px;
      color: #6a7a9a;
      margin: 0 5px;
    }

    .scroll-state {
      margin-top: 15px;
      padding: 8px 20px;
      display: inline-block;
      border-radius: 20px;
      font-size: 13px;
      letter-spacing: 1px;
    }

    .scroll-state.scrolling {
      background: rgba(77, 255, 136, 0.15);
      color: #4dff88;
      border: 1px solid rgba(77, 255, 136, 0.3);
    }

    .scroll-state.paused {
      background: rgba(255, 200, 77, 0.15);
      color: #ffc84d;
      border: 1px solid rgba(255, 200, 77, 0.3);
    }

    .scroll-state.idle {
      background: rgba(150, 160, 200, 0.15);
      color: #a0b0d0;
      border: 1px solid rgba(150, 160, 200, 0.3);
    }

    /* 控制按钮组 */
    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: auto;
      padding-bottom: 30px;
    }

    .control-btn {
      padding: 20px 10px;
      font-size: 28px;
      background: linear-gradient(145deg, rgba(50, 60, 100, 0.6), rgba(40, 50, 90, 0.8));
      border: 1px solid rgba(100, 140, 200, 0.2);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-btn .icon {
      font-size: 26px;
      filter: drop-shadow(0 0 8px rgba(150, 180, 255, 0.4));
    }

    .control-btn .label {
      font-size: 10px;
      color: #7a8aaa;
      letter-spacing: 1px;
    }

    .control-btn:hover:not(:disabled) {
      background: linear-gradient(145deg, rgba(70, 85, 140, 0.7), rgba(60, 75, 130, 0.9));
      border-color: rgba(150, 180, 255, 0.4);
      box-shadow: 0 0 25px rgba(100, 140, 255, 0.25);
      transform: translateY(-3px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(0);
    }

    .control-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* 主要按钮样式 */
    .control-btn.primary {
      background: linear-gradient(145deg, rgba(60, 80, 140, 0.7), rgba(50, 70, 120, 0.9));
    }

    .control-btn.primary:hover:not(:disabled) {
      background: linear-gradient(145deg, rgba(80, 110, 180, 0.8), rgba(70, 100, 160, 1));
      box-shadow: 0 0 35px rgba(100, 140, 255, 0.4);
    }

    /* 按钮发光效果 */
    .control-btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 80%;
      height: 80%;
      transform: translate(-50%, -50%);
      border-radius: 14px;
      background: radial-gradient(circle, rgba(150, 180, 255, 0.2) 0%, transparent 70%);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .control-btn:hover:not(:disabled)::before {
      opacity: 1;
      animation: glow 1.5s infinite;
    }

    @keyframes glow {
      0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
      50% { transform: translate(-50%, -50%) scale(1.1); opacity: 1; }
    }

    /* 响应式调整 */
    @media (max-width: 380px) {
      .control-btn {
        padding: 15px 8px;
      }
      .control-btn .icon {
        font-size: 22px;
      }
    }

    /* 浏览器提示 */
    .browser-hint {
      text-align: center;
      margin-top: 20px;
      font-size: 11px;
      color: #5a6a8a;
    }

    /* 动画反馈 */
    .control-btn.clicked {
      animation: btnClick 0.2s ease;
    }

    @keyframes btnClick {
      0% { transform: scale(1); }
      50% { transform: scale(0.95); }
      100% { transform: scale(1); }
    }

    /* 断开连接按钮 */
    .disconnect-btn {
      margin-top: 15px;
      padding: 10px;
      font-size: 12px;
      color: #ff6b6b;
      background: rgba(255, 100, 100, 0.1);
      border: 1px solid rgba(255, 100, 100, 0.2);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .disconnect-btn:hover {
      background: rgba(255, 100, 100, 0.2);
    }
  </style>
</head>
<body>
  <!-- 星尘粒子背景 -->
  <div class="stars" id="stars"></div>

  <div class="container">
    <!-- 头部 -->
    <div class="header">
      <div class="logo">✧ STARDUST ✧</div>
      <div class="subtitle">星屑遥控器</div>
    </div>

    <!-- 连接状态 -->
    <div class="connection-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">未连接</span>
    </div>

    <!-- 连接按钮 -->
    <button class="connect-btn" id="connectBtn" onclick="connectBLE()">
      ⚡ 连接星屑
    </button>

    <button class="disconnect-btn" id="disconnectBtn" style="display:none;" onclick="disconnectBLE()">
      断开连接
    </button>

    <!-- 状态卡片 -->
    <div class="status-card">
      <div class="diary-counter" id="diaryCounter">
        <span id="currentDiary">--</span><span>/</span><span id="totalDiary">--</span>
      </div>
      <div class="scroll-state idle" id="scrollState">空闲中</div>
    </div>

    <!-- 控制按钮 -->
    <div class="controls">
      <button class="control-btn" id="btnPrev" disabled onclick="sendCommand('PREV')">
        <span class="icon">⏮</span>
        <span class="label">PREV</span>
      </button>
      
      <button class="control-btn primary" id="btnSync" disabled onclick="sendCommand('SYNC')">
        <span class="icon">🔄</span>
        <span class="label">SYNC</span>
      </button>
      
      <button class="control-btn" id="btnNext" disabled onclick="sendCommand('NEXT')">
        <span class="icon">⏭</span>
        <span class="label">NEXT</span>
      </button>
      
      <button class="control-btn" id="btnStop" disabled onclick="sendCommand('STOP')">
        <span class="icon">⏸</span>
        <span class="label">STOP</span>
      </button>
      
      <button class="control-btn primary" id="btnPlay" disabled onclick="sendCommand('PLAY')">
        <span class="icon">▶</span>
        <span class="label">PLAY</span>
      </button>
    </div>

    <div class="browser-hint">
      ⚠️ 请使用 Chrome、Edge 或 Opera 浏览器<br>
      并确保设备支持蓝牙
    </div>
  </div>

  <script>
    // ============================================================
    // BLE Configuration - MUST match ESP32 config.h
    // ============================================================
    const BLE_SERVICE_UUID = '0000fe40-0000-1000-8000-00805f9b34fb';
    const BLE_CMD_CHAR_UUID = '0000fe41-0000-1000-8000-00805f9b34fb';
    const BLE_STATUS_CHAR_UUID = '0000fe42-0000-1000-8000-00805f9b34fb';

    // BLE State
    let bleDevice = null;
    let bleServer = null;
    let bleService = null;
    let cmdCharacteristic = null;
    let statusCharacteristic = null;
    let isConnected = false;

    // DOM Elements
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');
    const currentDiary = document.getElementById('currentDiary');
    const totalDiary = document.getElementById('totalDiary');
    const scrollState = document.getElementById('scrollState');
    const controlBtns = document.querySelectorAll('.control-btn');

    // ============================================================
    // Star Dust Background Animation
    // ============================================================
    function createStars() {
      const starsContainer = document.getElementById('stars');
      const starCount = 60;
      
      for (let i = 0; i < starCount; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        star.style.animationDuration = (2 + Math.random() * 3) + 's';
        starsContainer.appendChild(star);
      }
    }
    createStars();

    // ============================================================
    // BLE Connection
    // ============================================================
    async function connectBLE() {
      if (!navigator.bluetooth) {
        alert('您的浏览器不支持 Web Bluetooth\n请使用 Chrome、Edge 或 Opera 浏览器');
        return;
      }

      try {
        statusText.textContent = '正在搜索设备...';
        
        bleDevice = await navigator.bluetooth.requestDevice({
          filters: [{ namePrefix: 'Stardust' }],
          optionalServices: [BLE_SERVICE_UUID]
        });

        statusText.textContent = '已发现设备，正在连接...';
        
        bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
        
        await connectToServer();
        
      } catch (error) {
        console.error('BLE Connection Error:', error);
        statusText.textContent = '连接失败';
        setTimeout(() => {
          if (!isConnected) statusText.textContent = '未连接';
        }, 2000);
      }
    }

    async function connectToServer() {
      try {
        bleServer = await bleDevice.gatt.connect();
        bleService = await bleServer.getPrimaryService(BLE_SERVICE_UUID);
        
        // Get Command Characteristic (for writing)
        cmdCharacteristic = await bleService.getCharacteristic(BLE_CMD_CHAR_UUID);
        
        // Get Status Characteristic (for reading/notifications)
        statusCharacteristic = await bleService.getCharacteristic(BLE_STATUS_CHAR_UUID);
        
        // Read initial status
        await readStatus();
        
        // Subscribe to status notifications
        await statusCharacteristic.startNotifications();
        statusCharacteristic.addEventListener('characteristicvaluechanged', onStatusChanged);
        
        // Connected!
        isConnected = true;
        updateConnectionUI(true);
        
        console.log('BLE Connected successfully');
        
      } catch (error) {
        console.error('GATT Error:', error);
        throw error;
      }
    }

    function onDisconnected(event) {
      console.log('BLE Disconnected');
      isConnected = false;
      updateConnectionUI(false);
    }

    function updateConnectionUI(connected) {
      if (connected) {
        statusDot.classList.add('connected');
        statusText.textContent = '已连接';
        connectBtn.style.display = 'none';
        disconnectBtn.style.display = 'block';
        
        // Enable control buttons
        controlBtns.forEach(btn => btn.disabled = false);
      } else {
        statusDot.classList.remove('connected');
        statusText.textContent = '未连接';
        connectBtn.style.display = 'block';
        disconnectBtn.style.display = 'none';
        
        // Disable control buttons
        controlBtns.forEach(btn => btn.disabled = true);
        
        // Reset display
        currentDiary.textContent = '--';
        totalDiary.textContent = '--';
        scrollState.className = 'scroll-state idle';
        scrollState.textContent = '空闲中';
      }
    }

    async function disconnectBLE() {
      if (bleDevice && bleDevice.gatt.connected) {
        bleDevice.gatt.disconnect();
      }
      isConnected = false;
      updateConnectionUI(false);
    }

    // ============================================================
    // BLE Communication
    // ============================================================
    async function sendCommand(cmd) {
      if (!isConnected || !cmdCharacteristic) {
        console.error('Not connected');
        return;
      }

      try {
        const encoder = new TextEncoder();
        const data = encoder.encode(cmd);
        await cmdCharacteristic.writeValue(data);
        
        console.log('Command sent:', cmd);
        
        // Visual feedback
        const btn = document.querySelector(`[onclick="sendCommand('${cmd}')"]`);
        if (btn) {
          btn.classList.add('clicked');
          setTimeout(() => btn.classList.remove('clicked'), 200);
        }
        
      } catch (error) {
        console.error('Send command error:', error);
      }
    }

    async function readStatus() {
      if (!statusCharacteristic) return;
      
      try {
        const value = await statusCharacteristic.readValue();
        const decoder = new TextDecoder();
        const jsonStr = decoder.decode(value);
        updateStatusDisplay(jsonStr);
      } catch (error) {
        console.error('Read status error:', error);
      }
    }

    function onStatusChanged(event) {
      const value = event.target.value;
      const decoder = new TextDecoder();
      const jsonStr = decoder.decode(value);
      updateStatusDisplay(jsonStr);
    }

    function updateStatusDisplay(jsonStr) {
      try {
        const status = JSON.parse(jsonStr);
        
        // Update diary counter
        currentDiary.textContent = status.diary || '--';
        totalDiary.textContent = status.total || '--';
        
        // Update scroll state
        if (status.state === 'scrolling' && status.scrolling) {
          scrollState.className = 'scroll-state scrolling';
          scrollState.textContent = '滚动中';
        } else if (status.state === 'paused' || !status.scrolling) {
          scrollState.className = 'scroll-state paused';
          scrollState.textContent = '已暂停';
        } else {
          scrollState.className = 'scroll-state idle';
          scrollState.textContent = '空闲';
        }
        
      } catch (error) {
        console.error('Parse status error:', error);
      }
    }
  </script>
</body>
</html>
