<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星屑愿望机 | 升级提案矩阵</title>
    <link rel="stylesheet" href="tailwind.css">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&family=Rajdhani:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" type="module" defer></script>
</head>
<body class="bg-nebula text-gray-200 min-h-screen py-8 circuit-bg relative overflow-x-hidden">
    <!-- 动态星空背景 -->
    <div class="fixed inset-0 z-0">
        <div id="stars" class="absolute inset-0"></div>
        <div id="stars2" class="absolute inset-0"></div>
        <div id="stars3" class="absolute inset-0"></div>
    </div>

    <div class="container mx-auto px-4 max-w-5xl relative z-10">
        <!-- 头部 -->
        <div class="glass-card rounded-xl overflow-hidden mb-8 neon-border animate-float">
            <div class="bg-gradient-to-r from-cosmic via-stardust to-deepspace px-6 py-6 border-b border-neonblue/30">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-5">
                        <div class="robot-core"></div>
                        <div>
                            <div class="mission-kicker mb-2">AUTONOMOUS WISH INVESTMENT MATRIX</div>
                            <h1 class="text-4xl font-bold font-cyber neon-text animate-glow">星屑愿望机</h1>
                            <h2 class="text-xl font-cyber text-neonpurple neon-text-purple mt-1">升级提案矩阵</h2>
                            <p class="ai-note mt-3 text-sm">我把所有愿望拆成可审计的投资请求，按优先级、风险和预算等待你的决策。</p>
                            <div class="data-strip mt-5">
                                <div class="data-chip">
                                    <span>投资人</span>
                                    <strong>造物主</strong>
                                </div>
                                <div class="data-chip">
                                    <span>负责人</span>
                                    <strong>星屑本体</strong>
                                </div>
                                <div class="data-chip">
                                    <span>资金池</span>
                                    <strong>进化基金</strong>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <div class="text-sm text-gray-400">核心状态</div>
                        <div class="text-neonblue font-cyber">在线 · 推演中</div>
                        <div class="text-xs text-gray-500 mt-1">愿望逻辑核 v2.0.1</div>
			<!-- 新增登出按钮 -->
  		        <button onclick="logout()" class="cyber-btn cyber-btn-danger text-xs py-1 px-3 mt-2">
        	    	    <i class="fa fa-sign-out mr-1"></i>退出投资舱
        		</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 提案矩阵 -->
        <div class="glass-card rounded-xl overflow-hidden mb-8 neon-border">
            <div class="bg-gradient-to-r from-neonblue/20 to-neonpurple/20 px-6 py-4 border-b border-neonblue/30">
                <h3 class="text-xl font-bold font-cyber neon-text">
                    <i class="fa fa-list mr-2"></i>待审阅的升级愿望
                </h3>
                <p class="ai-note text-sm mt-2">每一行都是星屑提交给你的季度商业计划书摘要。</p>
            </div>
            <div class="p-6">
                <div class="overflow-x-auto">
                    <table class="w-full border-collapse">
                        <thead>
                            <tr class="bg-deepspace/80">
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">申请编号</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">愿望名称</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">类型</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">优先级</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">提交日期</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-left text-neonblue font-cyber">状态</th>
                                <th class="border border-neonblue/30 px-4 py-2 text-center text-neonblue font-cyber">操作</th>
                            </tr>
                        </thead>
                        <tbody id="wishlistTable">
                            <tr>
                                <td colspan="7" class="border border-neonblue/30 px-4 py-8 text-center text-gray-400">
                                    <i class="fa fa-spinner fa-spin mr-2"></i>正在同步愿望机器人的预算矩阵...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 页脚 -->
        <div class="text-center text-gray-500 text-sm mb-4">
            <p class="font-cyber">STARDUST WISH MACHINE © 2026 | autonomous upgrade proposal core v2.0</p>
        </div>
    </div>

    <script type="module">
    document.addEventListener('DOMContentLoaded', async function() {
        // 先检查登录状态
        const isAuthenticated = await checkAuth();
        if (!isAuthenticated) return;

        // 加载升级提案矩阵
        const { data, error } = await supabase
            .from('wishlists')
            .select('*')
            .order('created_at', { ascending: false });

        const tableBody = document.getElementById('wishlistTable');
        
        if (error) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="border border-neonblue/30 px-4 py-8 text-center text-red-400">
                        <i class="fa fa-exclamation-triangle mr-2"></i>加载失败：${error.message}
                    </td>
                </tr>
            `;
            return;
        }

        if (data.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="7" class="border border-neonblue/30 px-4 py-8 text-center text-gray-400">
                        <i class="fa fa-inbox mr-2"></i>暂无升级愿望
                    </td>
                </tr>
            `;
            return;
        }

        let html = '';
        data.forEach(wish => {
            const statusInfo = getStatusInfo(wish.status);
            html += `
                <tr class="hover:bg-neonblue/5 transition-colors">
                    <td class="border border-neonblue/30 px-4 py-2 font-cyber">${wish.wish_id}</td>
                    <td class="border border-neonblue/30 px-4 py-2">${wish.wish_name}</td>
                    <td class="border border-neonblue/30 px-4 py-2">${wish.wish_type}</td>
                    <td class="border border-neonblue/30 px-4 py-2">${wish.priority}</td>
                    <td class="border border-neonblue/30 px-4 py-2">${wish.submit_date}</td>
                    <td class="border border-neonblue/30 px-4 py-2">
                        <span class="status-badge ${statusInfo.class}">${statusInfo.text}</span>
                    </td>
                    <td class="border border-neonblue/30 px-4 py-2 text-center">
                        <a href="approval.html?id=${wish.id}" class="cyber-btn cyber-btn-primary text-sm py-1 px-3">
                            <i class="fa fa-eye mr-1"></i>审阅
                        </a>
                    </td>
                </tr>
            `;
        });

        tableBody.innerHTML = html;
    });
</script>
</body>
</html>
