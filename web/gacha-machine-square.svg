<!--
  扭蛋机剪影 #3 — Square (赛博方型)
  ========================================
  分配给：NO.02(code), NO.05(life), NO.08(media), NO.11(format)

  === 绘制约束 (必读) ===

  1. 画布
     viewBox="0 0 200 280"，CSS 容器 160×230(桌面)/135×195(平板)/110×165(手机)

  2. 色彩约束 — 仅 #1e2622，通过透明度制造轻重层次
     rgba(30,38,34,0.12)  — 最深，结构性色块、实体面板
     rgba(30,38,34,0.07)  — 中等，机身面板、滚筒底色
     rgba(30,38,34,0.03)  — 浅，过渡面
     rgba(255,255,255,0.08) — 微弱高光
     ★ 单色多透明度 = 像素风的灰度层次。

  3. 结构层次
     - 顶部：锯齿跳线装饰 + 指示灯条
     - 中段：方形机身外壳 → 十字分隔的方形滚筒(内部)
     - 下半身：封闭式横纹前面板 → 结实底座
     - 胶囊出口：面板上的横向窄槽
     ★ 内部结构被外壳遮挡，不画裸露滑道！

  4. 必须保留的动画节点（class + CSS变量）
     class="gba-svg-knob"    style="--knob-cx:Npx;--knob-cy:Npx"
     class="gba-svg-drum"    style="--drum-cx:Npx;--drum-cy:Npx"
     class="gba-svg-capsule" style="--capsule-cx:Npx;--capsule-cy:Npx" ×6颗
     class="gba-svg-prize"   style="--prize-cx:Npx;--prize-cy:Npx"

  5. 胶囊：6颗，散布在滚筒4个象限 + 中央

  6. 不画：背景色/<html>/<body>/emoji/文字/裸露管道
-->
<svg class="gba-machine-svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="lcd-grid-s" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="none"/>
            <rect width="1" height="1" fill="rgba(30,38,34,0.06)"/>
        </pattern>
    </defs>

    <!-- ═══ 顶部：锯齿跳线 + 指示灯条 ═══ -->
    <!-- 锯齿装饰 -->
    <path d="M 46 42 L 54 34 L 62 42 L 70 34 L 78 42 L 86 34 L 94 42 L 102 34 L 110 42 L 118 34 L 126 42 L 134 34 L 142 42 L 150 34 L 158 42" fill="none" stroke="#1e2622" stroke-width="2"/>
    <!-- 指示灯条背景 -->
    <rect x="56" y="46" width="88" height="20" rx="2" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
    <!-- 指示灯 (5个) -->
    <rect x="60" y="50" width="10" height="6" fill="rgba(30,38,34,0.12)"/>
    <rect x="74" y="50" width="10" height="6" fill="rgba(30,38,34,0.12)"/>
    <rect x="88" y="50" width="10" height="6" fill="none" stroke="#1e2622" stroke-width="1"/>
    <rect x="102" y="50" width="10" height="6" fill="rgba(30,38,34,0.12)"/>
    <rect x="116" y="50" width="10" height="6" fill="none" stroke="#1e2622" stroke-width="1"/>
    <!-- 指示灯条边框高光 -->
    <line x1="56" y1="48" x2="144" y2="48" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

    <!-- ═══ 中段上：方形机身外壳 ═══ -->
    <rect x="40" y="70" width="120" height="110" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="3"/>
    <!-- 机身侧线 -->
    <line x1="40" y1="85" x2="160" y2="85" stroke="#1e2622" stroke-width="1" stroke-dasharray="3,5"/>

    <!-- ═══ 方形滚筒 (旋转中心: 100,135) ═══ -->
    <g class="gba-svg-drum" style="--drum-cx:100px;--drum-cy:135px;">
        <!-- 滚筒底色 -->
        <rect x="46" y="90" width="108" height="80" rx="2" fill="rgba(30,38,34,0.03)"/>
        <!-- 滚筒边框 -->
        <rect x="46" y="90" width="108" height="80" rx="2" fill="none" stroke="#1e2622" stroke-width="2"/>
        <!-- 十字分隔线 -->
        <line x1="100" y1="90" x2="100" y2="170" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="2,4"/>
        <line x1="46" y1="130" x2="154" y2="130" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="2,4"/>

        <!-- 胶囊 #1 左上 -->
        <g class="gba-svg-capsule" style="--capsule-cx:70px;--capsule-cy:105px;">
            <circle cx="70" cy="105" r="9" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="62" y1="105" x2="78" y2="105" stroke="#1e2622" stroke-width="1"/>
        </g>
        <!-- 胶囊 #2 右上 -->
        <g class="gba-svg-capsule" style="--capsule-cx:130px;--capsule-cy:106px;">
            <circle cx="130" cy="106" r="8" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="124" y1="106" x2="136" y2="106" stroke="#1e2622" stroke-width="1"/>
        </g>
        <!-- 胶囊 #3 左中 -->
        <g class="gba-svg-capsule" style="--capsule-cx:100px;--capsule-cy:115px;">
            <circle cx="100" cy="115" r="8" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="94" y1="115" x2="106" y2="115" stroke="#1e2622" stroke-width="1"/>
        </g>
        <!-- 胶囊 #4 左下 -->
        <g class="gba-svg-capsule" style="--capsule-cx:75px;--capsule-cy:148px;">
            <circle cx="75" cy="148" r="10" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="67" y1="148" x2="83" y2="148" stroke="#1e2622" stroke-width="1"/>
        </g>
        <!-- 胶囊 #5 右下 -->
        <g class="gba-svg-capsule" style="--capsule-cx:128px;--capsule-cy:147px;">
            <circle cx="128" cy="147" r="9" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="120" y1="147" x2="136" y2="147" stroke="#1e2622" stroke-width="1"/>
        </g>
        <!-- 胶囊 #6 中下 -->
        <g class="gba-svg-capsule" style="--capsule-cx:102px;--capsule-cy:160px;">
            <circle cx="102" cy="160" r="7" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="96" y1="160" x2="108" y2="160" stroke="#1e2622" stroke-width="1"/>
        </g>
    </g>

    <!-- ═══ 下半身：封闭式横纹前面板 ═══ -->
    <rect x="38" y="182" width="124" height="42" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="2.5"/>
    <!-- 面板分格 -->
    <line x1="38" y1="196" x2="162" y2="196" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 胶囊出口 (横槽) -->
    <rect x="72" y="200" width="56" height="5" rx="1" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="1.5"/>
    <line x1="50" y1="210" x2="150" y2="210" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- 奖品出口 (掉落起点: 100,205) -->
    <g class="gba-svg-prize" style="--prize-cx:100px;--prize-cy:205px;">
        <rect x="97" y="202" width="6" height="6" rx="1" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
    </g>

    <!-- ═══ 底座 ═══ -->
    <rect x="36" y="226" width="128" height="28" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="3"/>
    <rect x="46" y="232" width="108" height="4" fill="rgba(30,38,34,0.07)"/>
    <rect x="46" y="240" width="108" height="4" fill="rgba(30,38,34,0.07)"/>
    <rect x="46" y="248" width="108" height="4" fill="rgba(30,38,34,0.07)"/>
    <!-- 底座脚垫 -->
    <rect x="42" y="256" width="26" height="5" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>
    <rect x="132" y="256" width="26" height="5" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 螺丝 -->
    <circle cx="55" cy="258" r="2" fill="#1e2622"/>
    <circle cx="145" cy="258" r="2" fill="#1e2622"/>

    <!-- ═══ 摇把 (旋转中心: 32,110) — 左侧 ═══ -->
    <g class="gba-svg-knob" style="--knob-cx:32px;--knob-cy:110px;">
        <line x1="44" y1="110" x2="34" y2="110" stroke="#1e2622" stroke-width="4" stroke-linecap="round"/>
        <rect x="20" y="100" width="22" height="20" rx="2" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2.5"/>
        <circle cx="31" cy="110" r="3" fill="#1e2622"/>
        <line x1="23" y1="110" x2="39" y2="110" stroke="#1e2622" stroke-width="1.5"/>
        <line x1="31" y1="102" x2="31" y2="118" stroke="#1e2622" stroke-width="1.5"/>
    </g>
</svg>
