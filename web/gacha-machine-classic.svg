<!--
  扭蛋机剪影 #1 — Classic (经典圆顶型)
  ========================================
  分配给：NO.01(全风格普池), NO.04(work), NO.07(creative), NO.10(fiction)

  === 绘制约束 (必读) ===

  1. 画布
     viewBox="0 0 200 280"，CSS 容器 160×230(桌面)/135×195(平板)/110×165(手机)

  2. 色彩约束 — 仅 #1e2622 一种颜色，通过透明度制造轻重层次
     rgba(30,38,34,0.12)  — 最深，用于结构性色块、阴影、实体面板
     rgba(30,38,34,0.07)  — 中等，用于机身面板、滚筒区底色
     rgba(30,38,34,0.03)  — 浅，用于玻璃内壁、过渡面
     rgba(255,255,255,0.10) — 玻璃高光反光
     ★ 不要引入任何其他颜色！单色多透明度才是这个像素风的精髓。

  3. 结构层次（重点）
     - 上半身：玻璃圆罩 → 胶囊滚筒(内部) → 滚筒周围的外壳框架
     - 下半身：封闭式前面板(填充0.12)覆盖内部滑道 → 结实的底座
     - 胶囊出口是一个横向窄槽，嵌在前面板中
     ★ 内部滑道被外壳遮挡，不要画裸露的滑道！

  4. 必须保留的动画节点（class + CSS变量缺一不可）
     class="gba-svg-knob"    style="--knob-cx:Npx;--knob-cy:Npx"
     class="gba-svg-drum"    style="--drum-cx:Npx;--drum-cy:Npx"
     class="gba-svg-capsule" style="--capsule-cx:Npx;--capsule-cy:Npx" ×6颗
     class="gba-svg-prize"   style="--prize-cx:Npx;--prize-cy:Npx"
     N值是该组的几何中心坐标(viewBox系)，必须精确！

  5. 胶囊
     6颗，散布滚筒内无重叠，每颗有独立nth-child序号驱动不同碰撞轨迹

  6. 不画：背景色/<html>/<body>/emoji/文字/裸露管道
-->
<svg class="gba-machine-svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="lcd-grid" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="none"/>
            <rect width="1" height="1" fill="rgba(30,38,34,0.06)"/>
        </pattern>
    </defs>

    <!-- ═══ 上半身：圆顶玻璃罩 ═══ -->
    <!-- 玻璃内壁底色 -->
    <ellipse cx="100" cy="90" rx="62" ry="60" fill="rgba(30,38,34,0.03)" stroke="none"/>
    <!-- 玻璃罩轮廓 + 网格纹理 -->
    <ellipse cx="100" cy="90" rx="62" ry="60" fill="url(#lcd-grid)" stroke="#1e2622" stroke-width="3"/>
    <!-- 玻璃高光弧线 -->
    <path d="M 50 60 Q 70 18 100 16" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2.5"/>
    <path d="M 55 72 Q 72 34 100 32" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

    <!-- ═══ 中段：圆顶下方过渡外壳 ═══ -->
    <rect x="44" y="90" width="112" height="14" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="2"/>
    <!-- 边框线 -->
    <line x1="44" y1="90" x2="156" y2="90" stroke="#1e2622" stroke-width="2.5"/>
    <line x1="44" y1="104" x2="156" y2="104" stroke="#1e2622" stroke-width="2"/>

    <!-- ═══ 胶囊滚筒 (旋转中心: 100,145) ═══ -->
    <g class="gba-svg-drum" style="--drum-cx:100px;--drum-cy:145px;">
        <!-- 滚筒底色 -->
        <rect x="48" y="104" width="104" height="74" rx="3" fill="rgba(30,38,34,0.03)"/>
        <!-- 滚筒边框 -->
        <rect x="48" y="104" width="104" height="74" rx="3" fill="none" stroke="#1e2622" stroke-width="2.5"/>
        <!-- 水平分隔线 -->
        <line x1="48" y1="122" x2="152" y2="122" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="3,4"/>
        <line x1="48" y1="140" x2="152" y2="140" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="3,4"/>
        <line x1="48" y1="158" x2="152" y2="158" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="3,4"/>

        <!-- 胶囊 #1 -->
        <g class="gba-svg-capsule" style="--capsule-cx:68px;--capsule-cy:112px;">
            <circle cx="68" cy="112" r="9" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="60" y1="112" x2="76" y2="112" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #2 -->
        <g class="gba-svg-capsule" style="--capsule-cx:98px;--capsule-cy:110px;">
            <circle cx="98" cy="110" r="10" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="90" y1="110" x2="106" y2="110" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #3 -->
        <g class="gba-svg-capsule" style="--capsule-cx:132px;--capsule-cy:114px;">
            <circle cx="132" cy="114" r="9" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="124" y1="114" x2="140" y2="114" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #4 -->
        <g class="gba-svg-capsule" style="--capsule-cx:80px;--capsule-cy:150px;">
            <circle cx="80" cy="150" r="11" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="70" y1="150" x2="90" y2="150" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #5 -->
        <g class="gba-svg-capsule" style="--capsule-cx:118px;--capsule-cy:152px;">
            <circle cx="118" cy="152" r="10" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="110" y1="152" x2="126" y2="152" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #6 -->
        <g class="gba-svg-capsule" style="--capsule-cx:96px;--capsule-cy:168px;">
            <circle cx="96" cy="168" r="8" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
            <line x1="90" y1="168" x2="102" y2="168" stroke="#1e2622" stroke-width="1.5"/>
        </g>
    </g>

    <!-- ═══ 下半身：封闭式前面板 (覆盖内部滑道) ═══ -->
    <!-- 面板主体 -->
    <rect x="40" y="182" width="120" height="52" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="2.5"/>
    <!-- 面板内部分隔线 -->
    <line x1="40" y1="196" x2="160" y2="196" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 胶囊出口 (横向窄槽，嵌在面板中) -->
    <rect x="74" y="200" width="52" height="5" rx="1" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 面板装饰线 -->
    <line x1="56" y1="210" x2="144" y2="210" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- 奖品出口 (掉落起点: 100,205 — 在槽口正后方，初始不可见) -->
    <g class="gba-svg-prize" style="--prize-cx:100px;--prize-cy:205px;">
        <circle cx="100" cy="205" r="6" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
    </g>

    <!-- ═══ 底座 ═══ -->
    <rect x="36" y="236" width="128" height="26" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="3"/>
    <!-- 底座面板横线 -->
    <line x1="36" y1="248" x2="164" y2="248" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 底座脚垫 -->
    <rect x="44" y="262" width="24" height="6" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>
    <rect x="132" y="262" width="24" height="6" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 底座螺丝 -->
    <circle cx="56" cy="265" r="2" fill="#1e2622"/>
    <circle cx="144" cy="265" r="2" fill="#1e2622"/>

    <!-- ═══ 摇把 (旋转中心: 175,148) — 右侧中段 ═══ -->
    <g class="gba-svg-knob" style="--knob-cx:175px;--knob-cy:148px;">
        <line x1="158" y1="148" x2="168" y2="148" stroke="#1e2622" stroke-width="4" stroke-linecap="round"/>
        <circle cx="175" cy="148" r="11" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2.5"/>
        <circle cx="175" cy="148" r="3" fill="#1e2622"/>
        <line x1="175" y1="140" x2="175" y2="156" stroke="#1e2622" stroke-width="1.5"/>
        <line x1="167" y1="148" x2="183" y2="148" stroke="#1e2622" stroke-width="1.5"/>
    </g>
</svg>
