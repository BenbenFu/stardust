<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsule Card Preview</title>
<link rel="stylesheet" href="style.css?v=20260614">
<link rel="stylesheet" href="gallery-cards.css?v=20260614">
<script type="module" src="script.js?v=20260602"></script>
<style>
    :root {
        --gba-bg: #cadbb7;
        --pixel-dark: #1e2622;
        --pixel-dim: #707a65;
        --pixel-alert: #8f341d;
        --repair-tape: #d2c89f;
    }
    * { image-rendering: pixelated; box-sizing: border-box; }
    body {
        background: var(--gba-bg);
        color: var(--pixel-dark);
        font-family: "Courier New", monospace;
        margin: 0; padding: 12px;
        display: flex; gap: 16px;
        height: 100vh;
    }

    .panel {
        background: rgba(0,0,0,0.04);
        border: 2px solid var(--pixel-dark);
        padding: 12px;
        overflow-y: auto;
    }

    .panel-left { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .panel-right { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

    label { font-size: 10px; font-weight: bold; color: var(--pixel-dim); display: block; margin-bottom: 2px; }

    select, textarea, button {
        font-family: "Courier New", monospace;
        font-size: 11px;
        background: var(--gba-bg);
        border: 1px solid var(--pixel-dark);
        color: var(--pixel-dark);
        padding: 6px 8px;
        width: 100%;
    }
    textarea {
        flex: 1;
        min-height: 250px;
        resize: vertical;
        tab-size: 2;
        line-height: 1.5;
    }
    button { cursor: pointer; font-weight: bold; }
    button:hover { background: var(--pixel-dark); color: var(--gba-bg); }
    button.save-btn { border-color: var(--pixel-alert); color: var(--pixel-alert); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:disabled:hover { background: var(--gba-bg); color: var(--pixel-dark); }

    .preview-area {
        flex: 1;
        border: 2px dashed var(--pixel-dim);
        padding: 16px;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 200px;
    }
    .preview-area .gallery-card {
        width: 300px;
        flex-shrink: 0;
    }

    .info-panel {
        background: rgba(0,0,0,0.03);
        border: 1px solid var(--pixel-dim);
        padding: 8px 10px;
        font-size: 10px;
        display: none;
    }
    .info-panel.show { display: block; }
    .info-panel .info-row { margin-bottom: 4px; display: flex; gap: 6px; }
    .info-panel .info-label { color: var(--pixel-dim); flex-shrink: 0; min-width: 50px; }
    .info-panel .info-value { color: var(--pixel-dark); word-break: break-all; flex: 1; }
    .info-panel button {
        width: auto; font-size: 9px; padding: 2px 8px;
        margin-top: 4px; background: var(--pixel-dark); color: var(--gba-bg);
    }

    .status { font-size: 10px; color: var(--pixel-dim); margin-top: 4px; }
    .status.ok { color: #3a7d44; }
    .status.err { color: var(--pixel-alert); }

    .section-title {
        font-size: 11px; font-weight: bold;
        border-bottom: 1px solid var(--pixel-dim);
        padding-bottom: 4px; margin-bottom: 6px;
    }

    /* === 审核面板样式 === */
    .audit-panel { margin-top: 8px; border: 1px solid var(--pixel-dim); padding: 8px; font-size: 9px; display: none; }
    .audit-section { margin-bottom: 6px; }
    .audit-label { font-weight: bold; color: var(--pixel-dark); margin-bottom: 2px; font-size: 10px; }
    .audit-result { color: var(--pixel-dim); font-size: 9px; }
    .audit-result.pass { color: #3a7d44; }
    .audit-result.fail { color: var(--pixel-alert); }
    .audit-details { margin-top: 2px; padding-left: 8px; border-left: 2px solid var(--pixel-dim); font-size: 8px; max-height: 90px; overflow-y: auto; }
    .audit-detail-item { margin-bottom: 1px; line-height: 1.3; }
    .audit-detail-item.pass { color: #3a7d44; }
    .audit-detail-item.fail { color: var(--pixel-alert); }
    .score-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .score-bar { flex: 1; height: 4px; background: var(--pixel-dim); }
    .score-fill { height: 100%; background: var(--pixel-alert); transition: width 0.2s; }
    .score-fill.pass { background: #3a7d44; }
    .score-num { font-size: 9px; min-width: 28px; text-align: right; }
    .btn-normalize {
        margin-top: 4px; font-size: 9px; padding: 3px 8px;
        width: 100%; border: 1px solid var(--pixel-dark);
        background: var(--gba-bg); cursor: pointer;
        font-family: "Courier New", monospace;
    }
    .btn-normalize:hover { background: var(--pixel-dark); color: var(--gba-bg); }
</style>
</head>
<body>
<div class="panel panel-left">
    <div class="section-title">CAPSULE_CSS_PREVIEW :: v0.2</div>

    <div>
        <label>扭蛋选择（STYLE_POOL.name）</label>
        <select id="capsuleSelect">
            <option value="">-- 加载中... --</option>
        </select>
    </div>

    <div style="display:flex;gap:6px;">
        <button id="btnLoad" style="flex:1;">[ LOAD_加载 ]</button>
        <button id="btnSave" class="save-btn" style="flex:1;">[ SAVE_保存到DB ]</button>
    </div>

    <label>card_css 编辑区</label>

    <div class="info-panel" id="infoPanel">
        <div class="info-row"><span class="info-label">DESC:</span><span class="info-value" id="infoDesc"></span></div>
        <div class="info-row"><span class="info-label">CATEGORY:</span><span class="info-value" id="infoCat"></span></div>
        <button id="btnCopyInfo">[ COPY_复制到剪贴板 ]</button>
    </div>

    <textarea id="cssEditor" placeholder="在此粘贴或编辑 CSS..."></textarea>

    <button id="btnPreview">[ PREVIEW_预览 ]</button>

    <div id="statusMsg" class="status"></div>

    <!-- 审核面板 -->
    <div class="audit-panel" id="auditPanel">
        <div class="section-title">审核结果</div>
        <div class="audit-section">
            <div class="audit-label">工程红线 <span id="redLineScore">-</span>/7</div>
            <div class="audit-result" id="redLineResult">未检测</div>
            <div class="audit-details" id="redLineDetails"></div>
        </div>
        <div class="audit-section">
            <div class="audit-label">质量评分 <span id="qualityScoreDisplay">-</span>/100</div>
            <div class="score-row"><div class="score-bar"><div class="score-fill" id="qualityBar"></div></div><span class="score-num" id="qualityNum">-</span></div>
            <div class="audit-result" id="qualityResult">未检测</div>
            <div class="audit-details" id="qualityDetails"></div>
        </div>
        <div class="audit-section">
            <div class="audit-label">差异度 <span id="diffScoreDisplay">-</span>% <span id="diffAgainst" style="color:var(--pixel-dim);font-size:8px;">(vs -)</span></div>
            <div class="score-row"><div class="score-bar"><div class="score-fill" id="diffBar"></div></div><span class="score-num" id="diffNum">-</span></div>
            <div class="audit-result" id="diffResult">未检测</div>
            <div class="audit-details" id="diffDetails"></div>
        </div>
        <button id="btnNormalize" class="btn-normalize">[ NORMALIZE_规范化 ]</button>
    </div>

    <div class="section-title" style="margin-top:6px;">快速操作</div>
    <div style="display:flex;gap:4px;flex-wrap:wrap;">
        <button id="btnClear" style="flex:1;font-size:10px;">[ CLEAR ]</button>
        <button id="btnResetFilter" style="flex:1;font-size:10px;">[ RESET ]</button>
    </div>
    <div style="font-size:9px;color:var(--pixel-dim);">
        RESET: 清空编辑区并重新从DB加载。CLEAR: 仅清空编辑区。
    </div>
</div>

<div class="panel panel-right">
    <div class="section-title">实时预览</div>
    <div class="preview-area" id="previewArea">
        <div style="color:var(--pixel-dim);font-size:11px;padding:20px;">
            >>> 选择一个扭蛋并点击 [PREVIEW_预览] 查看效果 <<<
        </div>
    </div>
</div>

<script type="module">
    import { supabase, checkAuth } from './script.js';
    import { renderCard } from './gallery-cards.js';

    const select = document.getElementById('capsuleSelect');
    const editor = document.getElementById('cssEditor');
    const previewArea = document.getElementById('previewArea');
    const statusMsg = document.getElementById('statusMsg');
    const infoPanel = document.getElementById('infoPanel');
    const infoDesc = document.getElementById('infoDesc');
    const infoCat = document.getElementById('infoCat');
    const btnPreview = document.getElementById('btnPreview');
    const btnSave = document.getElementById('btnSave');
    const btnLoad = document.getElementById('btnLoad');
    const btnClear = document.getElementById('btnClear');
    const btnReset = document.getElementById('btnResetFilter');
    const btnCopyInfo = document.getElementById('btnCopyInfo');
    const auditPanel = document.getElementById('auditPanel');

    let stylePoolData = [];
    let currentCSS = null;
    let currentName = null;
    let currentDesc = '';
    let currentCat = '';

    // ========== 工具函数 ==========
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function setStatus(msg, ok) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status ' + (ok ? 'ok' : 'err');
    }

    // ========== scopeCSS：自动注入 [data-cs="xxx"] 前缀 ==========
    function scopeCSS(css, name) {
        const attr = CSS.escape(name);
        return css.replace(/([^\n{]*)\s*\{/g, (match, selector) => {
            const trimmed = selector.trim();
            if (!trimmed || trimmed.startsWith('@')) return match;
            const parts = trimmed.split(',').map(s => {
                const sel = s.trim();
                if (sel.startsWith('.gallery-card')) return `[data-cs="${attr}"]${sel}`;
                return `[data-cs="${attr}"] ${sel}`;
            });
            return parts.join(', ') + ' {';
        });
    }

    // ========== normalizeCSS：统一 CSS 格式 ==========
    function normalizeCSS(css) {
        let s = css.replace(/\r\n?/g, '\n').trimEnd();
        let lines = s.split('\n').map(l => l.trimEnd());
        let result = [];
        let indent = 0;
        let inComment = false;
        let inMultilineComment = false;

        for (let i = 0; i < lines.length; i++) {
            let raw = lines[i];
            let line = raw.trim();

            // 注释处理
            if (inMultilineComment) {
                result.push('  '.repeat(Math.max(0, indent - 1)) + raw.trim());
                if (line.includes('*/')) inMultilineComment = false;
                continue;
            }
            if (line.startsWith('/*')) {
                inMultilineComment = !line.includes('*/');
                result.push('  '.repeat(indent) + line);
                continue;
            }
            if (line === '') {
                if (result.length > 0 && result[result.length - 1] !== '') {
                    result.push('');
                }
                continue;
            }

            // 处理 }：先减少缩进
            if (line.startsWith('}') || line.includes('}') && !line.includes('{') && line.indexOf('}') < line.indexOf('{')) {
                indent = Math.max(0, indent - 1);
            }

            result.push('  '.repeat(Math.max(0, indent)) + line);

            // 处理 {：增加缩进（给下一行用）
            const openCount = (line.match(/{/g) || []).length;
            const closeCount = (line.match(/}/g) || []).length;
            indent += openCount - closeCount;
            indent = Math.max(0, indent);
        }

        while (result.length > 0 && result[result.length - 1] === '') result.pop();
        return result.join('\n') + '\n';
    }

    // ========== 工程红线检查 ==========
    function checkRedLines(css, name) {
        const details = [];
        let passed = 0;
        const total = 7;

        // 红线1: .gallery-card 容器使用 position: fixed/absolute
        if (/\.gallery-card[^}]*position\s*:\s*(fixed|absolute)/i.test(css)) {
            details.push({ rule: '红线1', pass: false, msg: '.gallery-card 容器禁止使用 position:fixed/absolute' });
        } else {
            passed++;
            details.push({ rule: '红线1', pass: true, msg: '容器未使用 fixed/absolute' });
        }

        // 红线2: 修改 break-inside
        if (/break-inside\s*:/i.test(css)) {
            details.push({ rule: '红线2', pass: false, msg: '禁止修改 break-inside 属性' });
        } else {
            passed++;
            details.push({ rule: '红线2', pass: true, msg: '未修改 break-inside' });
        }

        // 红线3: CSS 原文包含 [data-cs="
        if (css.includes('[data-cs="')) {
            details.push({ rule: '红线3', pass: false, msg: '禁止在 CSS 原文中写 [data-cs="..." 前缀' });
        } else {
            passed++;
            details.push({ rule: '红线3', pass: true, msg: '未包含 [data-cs= 前缀' });
        }

        // 红线4: 子元素有非透明背景但容器无实色背景（简易检查）
        const containerHasBg = /\.gallery-card[^}]*(background|background-color)\s*:\s*[^;]+(?![a-zA-Z])/i.test(css);
        // 简化：暂不直接判失败
        passed++;
        details.push({ rule: '红线4', pass: true, msg: '容器背景检查（需人工复核）' });

        // 红线5: emoji 字符
        const emojiRe = /[\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}]/u;
        if (emojiRe.test(css)) {
            details.push({ rule: '红线5', pass: false, msg: '全属性禁止 emoji 字符' });
        } else {
            passed++;
            details.push({ rule: '红线5', pass: true, msg: '未检测到 emoji' });
        }

        // 红线6: hover 改变 margin/padding/width/height
        const hoverBadRe = /\.gallery-card[^}]*:hover[^}]*(margin|padding|width|height)\s*:/i;
        if (hoverBadRe.test(css)) {
            details.push({ rule: '红线6', pass: false, msg: 'hover 禁止改变 margin/padding/width/height' });
        } else {
            passed++;
            details.push({ rule: '红线6', pass: true, msg: 'hover 未改变文档流尺寸' });
        }

        // 红线7: 固定宽度 > 250px 可能导致 250px 下溢出
        const widthRe = /width\s*:\s*(\d+)px/gi;
        let m;
        let overflowRisk = false;
        while ((m = widthRe.exec(css)) !== null) {
            if (parseInt(m[1]) > 250) overflowRisk = true;
        }
        if (overflowRisk) {
            details.push({ rule: '红线7', pass: false, msg: '存在 width > 250px 的属性，250px 下可能溢出' });
        } else {
            passed++;
            details.push({ rule: '红线7', pass: true, msg: '未检测到固定宽度 > 250px' });
        }

        return { passed, total, details };
    }

    // ========== 质量打分（0-100） ==========
    function scoreQuality(css) {
        let score = 0;
        const details = [];

        // 1. 正文字号 >= 10px（20分）
        const fontSizeRe = /\.card-highlight-item[^}]*font-size\s*:\s*(\d+)px/i;
        const m = css.match(fontSizeRe);
        if (m && parseInt(m[1]) >= 10) {
            score += 20;
            details.push({ item: '正文字号', pass: true, msg: `font-size: ${m[1]}px ≥ 10px` });
        } else if (m) {
            details.push({ item: '正文字号', pass: false, msg: `font-size: ${m[1]}px < 10px` });
        } else {
            score += 20;
            details.push({ item: '正文字号', pass: true, msg: '未覆盖 .card-highlight-item 字号，使用基类' });
        }

        // 2. 装饰元素（伪元素）数量 ≤ 3（20分）
        const pseudoMatches = css.match(/::?(before|after)/gi) || [];
        const pseudoCount = new Set(pseudoMatches.map(s => s.toLowerCase())).size;
        if (pseudoCount <= 3) {
            score += 20;
            details.push({ item: '装饰数量', pass: true, msg: `伪元素种类 ${pseudoCount} 种 ≤ 3` });
        } else {
            details.push({ item: '装饰数量', pass: false, msg: `伪元素种类 ${pseudoCount} 种 > 3` });
        }

        // 3. 无 emoji（15分）
        const emojiRe = /[\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}]/u;
        if (!emojiRe.test(css)) {
            score += 15;
            details.push({ item: 'Emoji', pass: true, msg: '未检测到 emoji' });
        } else {
            details.push({ item: 'Emoji', pass: false, msg: '检测到 emoji 字符' });
        }

        // 4. hover 不改变文档流（15分）
        const hoverBadRe = /\.gallery-card[^}]*:hover[^}]*(margin|padding|width|height)\s*:/i;
        if (!hoverBadRe.test(css)) {
            score += 15;
            details.push({ item: 'Hover', pass: true, msg: 'hover 未改变文档流尺寸' });
        } else {
            details.push({ item: 'Hover', pass: false, msg: 'hover 改变了 margin/padding/width/height' });
        }

        // 5. 对比度（15分，简易）
        score += 15;
        details.push({ item: '对比度', pass: true, msg: '简易检查通过（需人工复核）' });

        // 6. 250px 不溢出（15分）
        const widthRe2 = /width\s*:\s*(\d+)px/gi;
        let overflowRisk = false;
        let m2;
        while ((m2 = widthRe2.exec(css)) !== null) {
            if (parseInt(m2[1]) > 250) overflowRisk = true;
        }
        if (!overflowRisk) {
            score += 15;
            details.push({ item: '250px溢出', pass: true, msg: '未检测到固定宽度 > 250px' });
        } else {
            details.push({ item: '250px溢出', pass: false, msg: '存在固定宽度 > 250px 的属性' });
        }

        return { score, details };
    }

    // ========== 差异度打分（0-100，越高越好） ==========
    function scoreDifference(css, name, allCards) {
        function extractFeatures(c) {
            const selectors = [...(c.matchAll(/([^{]+)\s*\{/g) || [])].map(m => m[1].trim());
            const props = [...(c.matchAll(/^\s*([a-z-]+)\s*:/gim) || [])].map(m => m[1].toLowerCase());
            const colors = [...(c.matchAll(/#([0-9a-fA-F]{3,8})/g) || [])].map(m => m[0].toLowerCase());
            const pseudos = [...(c.matchAll(/::?(before|after)/gi) || [])].map(m => m[0].toLowerCase());
            const nthCount = (c.match(/:nth-of-type\(/g) || []).length;
            return { selectors: new Set(selectors), props: new Set(props), colors: new Set(colors), pseudos: new Set(pseudos), nthCount };
        }

        const featA = extractFeatures(css);
        let maxSim = 0;
        let mostSimilarName = '-';

        for (const row of allCards) {
            if (!row.card_css || row.name === name) continue;
            const featB = extractFeatures(row.card_css);

            // Jaccard 相似度（选择器）
            const selUnion = new Set([...featA.selectors, ...featB.selectors]);
            const selInter = new Set([...featA.selectors].filter(s => featB.selectors.has(s)));
            const selSim = selUnion.size === 0 ? 1 : selInter.size / selUnion.size;

            // Jaccard 相似度（属性名）
            const propUnion = new Set([...featA.props, ...featB.props]);
            const propInter = new Set([...featA.props].filter(p => featB.props.has(p)));
            const propSim = propUnion.size === 0 ? 1 : propInter.size / propUnion.size;

            // 伪元素匹配加分
            const pseudoMatch = [...featA.pseudos].filter(p => featB.pseudos.has(p)).length;

            // 综合相似度
            const sim = selSim * 0.3 + propSim * 0.5 + (pseudoMatch > 0 ? 0.2 : 0);
            if (sim > maxSim) {
                maxSim = sim;
                mostSimilarName = row.name;
            }
        }

        const diffScore = Math.round((1 - maxSim) * 100);
        const details = [{ item: '最相似卡片', pass: diffScore >= 60, msg: `与「${mostSimilarName}」相似度 ${(maxSim * 100).toFixed(1)}%` }];
        return { score: diffScore, mostSimilar: mostSimilarName, details };
    }

    // ========== 运行所有检查并更新 UI ==========
    async function runAllChecks() {
        const css = editor.value.trim();
        const name = select.value || currentName;
        if (!name || !css) {
            auditPanel.style.display = 'none';
            return;
        }
        auditPanel.style.display = 'block';

        // 红线检查
        const redResult = checkRedLines(css, name);
        redLineScore.textContent = redResult.passed + '/' + redResult.total;
        redLineResult.textContent = redResult.passed === redResult.total ? '通过' : '未通过';
        redLineResult.className = 'audit-result ' + (redResult.passed === redResult.total ? 'pass' : 'fail');
        redLineDetails.innerHTML = redResult.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.rule}: ${d.msg}</div>`).join('');

        // 质量打分
        const qualResult = scoreQuality(css);
        qualityScoreDisplay.textContent = qualResult.score;
        qualityNum.textContent = qualResult.score;
        qualityBar.style.width = qualResult.score + '%';
        qualityBar.className = 'score-fill ' + (qualResult.score >= 60 ? 'pass' : '');
        qualityResult.textContent = qualResult.score >= 60 ? '合格' : '待改进';
        qualityResult.className = 'audit-result ' + (qualResult.score >= 60 ? 'pass' : 'fail');
        qualityDetails.innerHTML = qualResult.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.item}: ${d.msg}</div>`).join('');

        // 差异度打分
        const diffResult = scoreDifference(css, name, stylePoolData);
        diffScoreDisplay.textContent = diffResult.score;
        diffNum.textContent = diffResult.score;
        diffBar.style.width = diffResult.score + '%';
        diffBar.className = 'score-fill ' + (diffResult.score >= 60 ? 'pass' : '');
        diffAgainst.textContent = `(vs ${diffResult.mostSimilar})`;
        diffResult.textContent = diffResult.score >= 60 ? '合格' : '同质化风险';
        diffResult.className = 'audit-result ' + (diffResult.score >= 60 ? 'pass' : 'fail');
        diffDetails.innerHTML = diffResult.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.item}: ${d.msg}</div>`).join('');

        // 保存按钮状态
        const canSave = (redResult.passed === redResult.total) && diffResult.score >= 60;
        btnSave.disabled = !canSave;
    }

    // ========== 构建预览卡片 ==========
    function buildPreview(name, css) {
        let styleEl = document.getElementById('preview-dynamic-css');
        if (styleEl) styleEl.remove();
        if (css) {
            styleEl = document.createElement('style');
            styleEl.id = 'preview-dynamic-css';
            styleEl.textContent = scopeCSS(css, name);
            document.head.appendChild(styleEl);
        }

        const dummyDiary = {
            id: 9999,
            title: '预览标题 · 示例日记',
            date: '2026/06/13',
            dateRaw: '2026-06-13',
            highlights: [
                '这是第一条精华句，用于预览卡片样式效果。',
                '这是第二条精华句，测试多句之间的分隔符样式。',
                '第三条，展示更多内容时的排版表现。'
            ],
            cardType: 'custom',
            capsuleName: name,
            capsuleCSS: css
        };

        previewArea.innerHTML = '<div style="text-align:center;margin-bottom:12px;font-size:10px;color:var(--pixel-dim);">' + escapeHtml(name) + ' · ' + (currentCat || '?') + (currentDesc ? ' · ' + currentDesc : '') + '</div>';
        previewArea.insertAdjacentHTML('beforeend', renderCard(dummyDiary));
    }

    // ========== 加载 STYLE_POOL 列表 ==========
    async function loadPool() {
        const { data, error } = await supabase.from('STYLE_POOL').select('name, category, desc, card_css').order('name');
        if (error) {
            setStatus('加载失败: ' + error.message, false);
            return;
        }
        stylePoolData = data || [];
        select.innerHTML = '<option value="">-- 选择扭蛋 (' + stylePoolData.length + ' 个) --</option>';
        stylePoolData.forEach(row => {
            const hasCSS = row.card_css ? ' [已设计]' : '';
            select.innerHTML += `<option value="${escapeHtml(row.name)}">${escapeHtml(row.name)}${hasCSS}</option>`;
        });
        setStatus(`已加载 ${stylePoolData.length} 个扭蛋`, true);
    }

    // ========== 事件绑定 ==========

    // 加载选中扭蛋的 card_css
    btnLoad.addEventListener('click', () => {
        const name = select.value;
        if (!name) { setStatus('请先选择一个扭蛋', false); return; }
        const row = stylePoolData.find(r => r.name === name);
        if (!row) { setStatus('未找到该扭蛋', false); return; }
        currentName = name;
        currentCSS = row.card_css || null;
        currentDesc = row.desc || '';
        currentCat = row.category || '';
        editor.value = currentCSS || '';
        infoDesc.textContent = currentDesc || '(无)';
        infoCat.textContent = currentCat || '(无)';
        infoPanel.classList.add('show');
        setStatus(`已加载: ${name}` + (currentCSS ? ' (已有设计)' : ' (空白)'), true);
        // 自动运行检查
        if (currentCSS) runAllChecks();
    });

    // 预览（自动规范化 + 审核）
    btnPreview.addEventListener('click', () => {
        const css = editor.value.trim();
        const name = select.value || currentName;
        if (!name) { setStatus('请先选择扭蛋', false); return; }
        // 自动规范化
        const normCSS = normalizeCSS(css);
        if (normCSS !== css) {
            editor.value = normCSS;
            setStatus('已自动规范化 CSS', true);
        }
        // 运行审核
        runAllChecks();
        // 构建预览
        buildPreview(name, normCSS.trim());
        setStatus('预览已更新' + (normCSS !== css ? '（已规范化）' : ''), true);
    });

    // 保存到 Supabase（需通过审核）
    btnSave.addEventListener('click', async () => {
        const name = select.value || currentName;
        if (!name) { setStatus('请先选择扭蛋', false); return; }
        if (btnSave.disabled) {
            setStatus('未通过审核，无法保存（需红线全过 + 差异度≥60%）', false);
            return;
        }
        const css = normalizeCSS(editor.value.trim());
        const { error } = await supabase
            .from('STYLE_POOL')
            .update({ card_css: css || null })
            .eq('name', name);
        if (error) {
            setStatus('保存失败: ' + error.message, false);
        } else {
            currentCSS = css || null;
            const row = stylePoolData.find(r => r.name === name);
            if (row) row.card_css = css || null;
            const opt = select.querySelector(`option[value="${name.replace(/"/g, '&quot;')}"]`);
            if (opt) opt.textContent = name + (css ? ' [已设计]' : '');
            setStatus('已保存: ' + name, true);
        }
    });

    // 规范化按钮
    btnNormalize.addEventListener('click', () => {
        const css = editor.value.trim();
        if (!css) { setStatus('编辑区为空', false); return; }
        const normCSS = normalizeCSS(css);
        editor.value = normCSS;
        runAllChecks();
        setStatus('已规范化 CSS', true);
    });

    // 修改时实时预览 + 审核
    let previewTimer;
    editor.addEventListener('input', () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
            const css = editor.value.trim();
            const name = select.value || currentName;
            if (name && css) {
                runAllChecks();
                buildPreview(name, css);
                setStatus('实时预览中...', true);
            }
        }, 800);
    });

    // 切换扭蛋时自动加载
    select.addEventListener('change', () => {
        btnLoad.click();
    });

    // 清空编辑区
    btnClear.addEventListener('click', () => {
        editor.value = '';
        setStatus('编辑区已清空', true);
    });

    // 复制信息
    btnCopyInfo.addEventListener('click', () => {
        const text = `扭蛋名: ${currentName || '-'}\n描述: ${currentDesc || '-'}\n分类: ${currentCat || '-'}`;
        navigator.clipboard.writeText(text).then(() => {
            setStatus('已复制到剪贴板', true);
        }).catch(() => {
            setStatus('复制失败', false);
        });
    });

    // 重置
    btnReset.addEventListener('click', () => {
        editor.value = currentCSS || '';
        runAllChecks();
        buildPreview(currentName, currentCSS || null);
        setStatus('已重置', true);
    });

    // ========== 初始化 ==========
    async function init() {
        const authed = await checkAuth();
        if (!authed) return;
        await loadPool();
    }
    init();
</script>
</body>
</html>
