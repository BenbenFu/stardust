<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capsule Card Preview</title>
<link rel="stylesheet" href="style.css?v=20260614">
<link rel="stylesheet" href="gallery-cards.css?v=20260614">
<script type="module" src="script.js?v=20260602"></script>
<style>
    :root {
        --gba-bg: #cadbb7;
        --pixel-dark: #1e2622;
        --pixel-dim: #707a65;
        --pixel-alert: #8f341d;
        --repair-tape: #d2c89f;
    }
    * { image-rendering: pixelated; box-sizing: border-box; }
    body {
        background: var(--gba-bg);
        color: var(--pixel-dark);
        font-family: "Courier New", monospace;
        margin: 0; padding: 12px;
        display: flex; gap: 16px;
        height: 100vh;
    }

    .panel {
        background: rgba(0,0,0,0.04);
        border: 2px solid var(--pixel-dark);
        padding: 12px;
        overflow-y: auto;
    }

    .panel-left { width: 380px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .panel-right { flex: 1; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

    label { font-size: 10px; font-weight: bold; color: var(--pixel-dim); display: block; margin-bottom: 2px; }

    select, textarea, button {
        font-family: "Courier New", monospace;
        font-size: 11px;
        background: var(--gba-bg);
        border: 1px solid var(--pixel-dark);
        color: var(--pixel-dark);
        padding: 6px 8px;
        width: 100%;
    }
    textarea {
        flex: 1;
        min-height: 250px;
        resize: vertical;
        tab-size: 2;
        line-height: 1.5;
    }
    button { cursor: pointer; font-weight: bold; }
    button:hover { background: var(--pixel-dark); color: var(--gba-bg); }
    button.save-btn { border-color: var(--pixel-alert); color: var(--pixel-alert); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:disabled:hover { background: var(--gba-bg); color: var(--pixel-dark); }

    .preview-area {
        flex: 1;
        border: 2px dashed var(--pixel-dim);
        padding: 16px;
        overflow-y: auto;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 200px;
    }
    .preview-area .gallery-card {
        width: 300px;
        flex-shrink: 0;
    }

    .info-panel {
        background: rgba(0,0,0,0.03);
        border: 1px solid var(--pixel-dim);
        padding: 8px 10px;
        font-size: 10px;
        display: none;
    }
    .info-panel.show { display: block; }
    .info-panel .info-row { margin-bottom: 4px; display: flex; gap: 6px; }
    .info-panel .info-label { color: var(--pixel-dim); flex-shrink: 0; min-width: 50px; }
    .info-panel .info-value { color: var(--pixel-dark); word-break: break-all; flex: 1; }
    .info-panel button {
        width: auto; font-size: 9px; padding: 2px 8px;
        margin-top: 4px; background: var(--pixel-dark); color: var(--gba-bg);
    }

    .status { font-size: 10px; color: var(--pixel-dim); margin-top: 4px; }
    .status.ok { color: #3a7d44; }
    .status.err { color: var(--pixel-alert); }

    .section-title {
        font-size: 11px; font-weight: bold;
        border-bottom: 1px solid var(--pixel-dim);
        padding-bottom: 4px; margin-bottom: 6px;
    }

    /* === 审核面板样式 === */
    .audit-panel { margin-top: 8px; border: 1px solid var(--pixel-dim); padding: 8px; font-size: 9px; display: none; }
    .audit-section { margin-bottom: 6px; }
    .audit-label { font-weight: bold; color: var(--pixel-dark); margin-bottom: 2px; font-size: 10px; }
    .audit-result { color: var(--pixel-dim); font-size: 9px; }
    .audit-result.pass { color: #3a7d44; }
    .audit-result.fail { color: var(--pixel-alert); }
    .audit-details { margin-top: 2px; padding-left: 8px; border-left: 2px solid var(--pixel-dim); font-size: 8px; max-height: 90px; overflow-y: auto; }
    .audit-detail-item { margin-bottom: 1px; line-height: 1.3; }
    .audit-detail-item.pass { color: #3a7d44; }
    .audit-detail-item.fail { color: var(--pixel-alert); }
    .score-row { display: flex; align-items: center; gap: 6px; margin-top: 2px; }
    .score-bar { flex: 1; height: 4px; background: var(--pixel-dim); }
    .score-fill { height: 100%; background: var(--pixel-alert); transition: width 0.2s; }
    .score-fill.pass { background: #3a7d44; }
    .score-num { font-size: 9px; min-width: 28px; text-align: right; }
    .btn-normalize {
        margin-top: 4px; font-size: 9px; padding: 3px 8px;
        width: 100%; border: 1px solid var(--pixel-dark);
        background: var(--gba-bg); cursor: pointer;
        font-family: "Courier New", monospace;
    }
    .btn-normalize:hover { background: var(--pixel-dark); color: var(--gba-bg); }
    .suggest-panel { margin-top: 6px; border: 1px solid var(--pixel-dim); padding: 8px; font-size: 9px; display: none; }
    .suggest-item { margin-bottom: 3px; color: var(--pixel-dark); line-height: 1.4; }
</style>
</head>

            >>> 选择一个扭蛋并点击 [PREVIEW_预览] 查看效果 <<<

<script type="module">
    import { supabase, checkAuth } from './script.js';
    import { renderCard } from './gallery-cards.js';

    const select = document.getElementById('capsuleSelect');
    const editor = document.getElementById('cssEditor');
    const previewArea = document.getElementById('previewArea');
    const statusMsg = document.getElementById('statusMsg');
    const infoPanel = document.getElementById('infoPanel');
    const infoDesc = document.getElementById('infoDesc');
    const infoCat = document.getElementById('infoCat');
    const btnPreview = document.getElementById('btnPreview');
    const btnSave = document.getElementById('btnSave');
    const btnLoad = document.getElementById('btnLoad');
    const btnClear = document.getElementById('btnClear');
    const btnReset = document.getElementById('btnResetFilter');
    const btnCopyInfo = document.getElementById('btnCopyInfo');
    const auditPanel = document.getElementById('auditPanel');
    const redLineScore = document.getElementById('redLineScore');
    const redLineResult = document.getElementById('redLineResult');
    const redLineDetails = document.getElementById('redLineDetails');
    const qualityScoreDisplay = document.getElementById('qualityScoreDisplay');
    const qualityBar = document.getElementById('qualityBar');
    const qualityNum = document.getElementById('qualityNum');
    const qualityResultEl = document.getElementById('qualityResult');
    const qualityDetails = document.getElementById('qualityDetails');
    const diffScoreDisplay = document.getElementById('diffScoreDisplay');
    const diffBar = document.getElementById('diffBar');
    const diffNum = document.getElementById('diffNum');
    const diffResultEl = document.getElementById('diffResult');
    const diffAgainst = document.getElementById('diffAgainst');
    const diffDetails = document.getElementById('diffDetails');
    const suggestPanel = document.getElementById('suggestPanel');
    const suggestContent = document.getElementById('suggestContent');

    let stylePoolData = [];
    let currentCSS = null;
    let currentName = null;
    let currentDesc = '';
    let currentCat = '';

    // ========== 工具函数 ==========
    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function setStatus(msg, ok) {
        statusMsg.textContent = msg;
        statusMsg.className = 'status ' + (ok ? 'ok' : 'err');
    }

    // ========== scopeCSS：自动注入 [data-cs="xxx"] 前缀 ==========
    function scopeCSS(css, name) {
        const attr = CSS.escape(name);
        return css.replace(/([^\n{]*)\s*\{/g, (match, selector) => {
            const trimmed = selector.trim();
            if (!trimmed || trimmed.startsWith('@')) return match;
            const parts = trimmed.split(',').map(s => {
                const sel = s.trim();
                if (sel.startsWith('.gallery-card')) return `[data-cs="${attr}"]${sel}`;
                return `[data-cs="${attr}"] ${sel}`;
            });
            return parts.join(', ') + ' {';
        });
    }

    // ========== normalizeCSS：统一 CSS 格式 ==========
    function normalizeCSS(css) {
        let s = css.replace(/\r\n?/g, '\n').trimEnd();
        let lines = s.split('\n').map(l => l.trimEnd());
        let result = [];
        let indent = 0;
        let inComment = false;
        let inMultilineComment = false;

        for (let i = 0; i < lines.length; i++) {
            let raw = lines[i];
            let line = raw.trim();

            // 注释处理
            if (inMultilineComment) {
                result.push('  '.repeat(Math.max(0, indent - 1)) + raw.trim());
                if (line.includes('*/')) inMultilineComment = false;
                continue;
            }
            if (line.startsWith('/*')) {
                inMultilineComment = !line.includes('*/');
                result.push('  '.repeat(indent) + line);
                continue;
            }
            if (line === '') {
                if (result.length > 0 && result[result.length - 1] !== '') {
                    result.push('');
                }
                continue;
            }

            // 处理 }：先减少缩进
            if (line.startsWith('}') || line.includes('}') && !line.includes('{') && line.indexOf('}') < line.indexOf('{')) {
                indent = Math.max(0, indent - 1);
            }

            result.push('  '.repeat(Math.max(0, indent)) + line);

            // 处理 {：增加缩进（给下一行用）
            const openCount = (line.match(/{/g) || []).length;
            const closeCount = (line.match(/}/g) || []).length;
            indent += openCount - closeCount;
            indent = Math.max(0, indent);
        }

        while (result.length > 0 && result[result.length - 1] === '') result.pop();
        return result.join('\n') + '\n';
    }

    // ========== CSS 变量解析 ==========
    const CSS_VARS = {
        '--pixel-dark': '#1e2622',
        '--pixel-dim': '#707a65',
        '--pixel-alert': '#8f341d',
        '--gba-bg': '#cadbb7',
        '--repair-tape': '#d2c89f',
    };

    function resolveVars(css) {
        return css.replace(/var\((--[\w-]+)\)/g, (m, v) => CSS_VARS[v] || m);
    }

    // ========== 背景色分类 ==========
    const WARM_PAPERS = new Set(['#f5f0e6','#f8f5ee','#f0eee8','#f5f0e8','#f5ecd9','#efe0c4','#f8f6f0','#f8f7f2','#faf6ee','#e5dcc8','#fdf8ec']);
    const COOL_PAPERS = new Set(['#f5f7fa','#fafafa','#f8f8f8','#f5f5f5','#f7f7f7','#ffffff','#fffdf7','#fff9e6']);
    const DARK_BGS = new Set(['#1e1e1e','#1e293b','#0b0e11','#121212']);
    const SEPIA_PAPERS = new Set(['#f5f0e1','#f5f0e8']);

    function classifyBg(rawBg) {
        const bg = rawBg.trim().toLowerCase().replace(/[\s"']/g, '');
        if (!bg) return 'none';
        if (bg.includes('gradient')) return 'gradient';
        if (WARM_PAPERS.has(bg) || SEPIA_PAPERS.has(bg)) return 'warm_paper';
        if (COOL_PAPERS.has(bg)) return 'cool_paper';
        if (DARK_BGS.has(bg)) return 'dark';
        const hexMatch = bg.match(/#([0-9a-f]{3,8})/);
        if (hexMatch) {
            let hex = hexMatch[1];
            if (hex.length === 3) hex = hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
            if (hex.length >= 6) {
                const r = parseInt(hex.substring(0,2), 16);
                const g = parseInt(hex.substring(2,4), 16);
                const b = parseInt(hex.substring(4,6), 16);
                const lum = 0.299*r + 0.587*g + 0.114*b;
                if (lum < 80) return 'dark';
                if (lum < 180) return 'mid';
                if (r > g && r > b) return 'warm_paper';
                if (b > r) return 'cool_paper';
                return 'cool_paper';
            }
        }
        return 'other';
    }

    // ========== 伪元素标签分类 ==========
    function classifyPseudoLabel(text) {
        if (!text) return 'none';
        if (/^[【「『《〈]/.test(text)) return 'cjk_bracket';
        if (/^\d{3}\s*[\|｜]/.test(text)) return 'http_code';
        if (/^[A-Z]{2,}[:：]/.test(text)) return 'ascii_label';
        if (/^\d+[.、)）]/.test(text)) return 'numbered';
        return 'other';
    }

    // ========== 视觉指纹提取 ==========
    function extractFingerprint(css) {
        const resolved = resolveVars(css);
        const lower = resolved.toLowerCase();
        const fp = {};

        // 1. 背景色
        const bgMatches = lower.match(/background(?:-color)?:\s*([^;}{]+)/);
        fp.bgRaw = bgMatches ? bgMatches[1].trim() : '';
        fp.bgFamily = classifyBg(fp.bgRaw);

        // 2. 字体族
        const fontMatches = lower.match(/font-family:\s*([^;}{]+)/g) || [];
        fp.fontFamily = 'default';
        for (const f of fontMatches) {
            if (/mono|consola|courier/.test(f)) { fp.fontFamily = 'monospace'; break; }
            if (/sans/.test(f)) { fp.fontFamily = 'sans'; break; }
            if (/serif/.test(f)) { fp.fontFamily = 'serif'; break; }
        }

        // 3. 视觉手法
        const allFilterCount = (lower.match(/\bfilter\s*:/g) || []).length;
        const prefixedFilterCount = (lower.match(/-\w+-filter\s*:/g) || []).length;
        fp.features = {
            gradient: lower.includes('gradient'),
            shadow: lower.includes('shadow'),
            borderRadius: lower.includes('border-radius'),
            animation: lower.includes('animation') || lower.includes('transition'),
            rotation: lower.includes('rotate'),
            opacity: lower.includes('opacity'),
            filter: allFilterCount > prefixedFilterCount,
            monospaceFont: fp.fontFamily === 'monospace',
            borderStrong: /[2-9]\d*px\s+solid/.test(lower),
            pseudoLabel: /::(?:before|after)\s*\{[^}]*content:/.test(resolved),
            textDecoration: lower.includes('text-decoration') || lower.includes('underline') || lower.includes('line-through'),
            transform: lower.includes('transform') && lower.includes('scale'),
            columns: lower.includes('column'),
            pattern: lower.includes('repeating') || lower.includes('pattern'),
            centerAligned: lower.includes('text-align: center'),
        };

        // 4. 伪元素文本
        const befores = [...resolved.matchAll(/::before\s*\{[^}]*content:\s*["']([^"']{1,40})["']/g)].map(m => m[1]);
        const afters = [...resolved.matchAll(/::after\s*\{[^}]*content:\s*["']([^"']{1,40})["']/g)].map(m => m[1]);
        fp.pseudoTexts = befores.slice(0, 3).concat(afters.slice(0, 3));
        fp.pseudoLabels = fp.pseudoTexts.map(t => classifyPseudoLabel(t));

        // 5. 视觉层数
        const pseudoCount = (css.match(/::(?:before|after)/g) || []).length;
        const nestedRules = (css.match(/\.gallery-card\s+\./g) || []).length;
        fp.layerCount = pseudoCount + nestedRules;

        return fp;
    }

    // ========== 视觉相似度计算 ==========
    function computeSimilarity(fpA, fpB) {
        let score = 0;
        let maxScore = 0;

        // 维度1: 背景色系 (25%)
        maxScore += 25;
        if (fpA.bgFamily === fpB.bgFamily) {
            score += 25;
            if (fpA.bgRaw && fpB.bgRaw && fpA.bgRaw.trim() === fpB.bgRaw.trim()) {
                score += 5;
                maxScore += 5;
            }
        }

        // 维度2: 字体族 (10%)
        maxScore += 10;
        if (fpA.fontFamily === fpB.fontFamily) score += 10;

        // 维度3: 视觉手法 (40%)
        maxScore += 40;
        const fa = fpA.features, fb = fpB.features;
        const aSet = new Set(Object.keys(fa).filter(k => fa[k]));
        const bSet = new Set(Object.keys(fb).filter(k => fb[k]));
        const commonIgnore = new Set(['shadow', 'animation']);
        const aUnique = new Set([...aSet].filter(k => !commonIgnore.has(k)));
        const bUnique = new Set([...bSet].filter(k => !commonIgnore.has(k)));
        if (aUnique.size > 0 || bUnique.size > 0) {
            const overlap = new Set([...aUnique].filter(k => bUnique.has(k)));
            const union = new Set([...aUnique, ...bUnique]);
            score += 40 * (overlap.size / union.size);
        } else {
            score += 40 * 0.8;
        }

        // 维度4: 层级复杂度 (10%)
        maxScore += 10;
        const layerDiff = Math.abs(fpA.layerCount - fpB.layerCount);
        score += Math.max(0, 10 - layerDiff * 3);

        // 维度5: 伪元素标签风格 (15%)
        maxScore += 15;
        if (fpA.pseudoLabels.length > 0 && fpB.pseudoLabels.length > 0) {
            for (let i = 0; i < Math.min(2, fpA.pseudoLabels.length); i++) {
                for (let j = 0; j < Math.min(2, fpB.pseudoLabels.length); j++) {
                    if (fpA.pseudoLabels[i] === fpB.pseudoLabels[j] && fpA.pseudoLabels[i] !== 'other') {
                        score += 7.5;
                        break;
                    }
                }
            }
        }

        return maxScore > 0 ? score / maxScore : 0;
    }

    // ========== 差异化建议 ==========
    function suggestDifferentiation(newFp, similarCards) {
        const suggestions = [];
        const sameBg = similarCards.filter(c => c.fp.bgFamily === newFp.bgFamily);
        if (sameBg.length >= 3) {
            if (newFp.bgFamily === 'cool_paper') {
                suggestions.push('[BG] 浅白/冷纸色已有' + sameBg.length + '张，考虑换暖纸色、深色底或渐变');
            } else if (newFp.bgFamily === 'warm_paper') {
                suggestions.push('[BG] 暖纸色已有' + sameBg.length + '张，考虑换冷色调、深色底或渐变');
            } else if (newFp.bgFamily === 'dark') {
                suggestions.push('[BG] 深色底已有' + sameBg.length + '张，考虑换浅色纸感或中间调');
            }
        }
        const newTech = new Set(Object.keys(newFp.features).filter(k => newFp.features[k]));
        newTech.delete('shadow'); newTech.delete('animation');
        if (newTech.size === 0) {
            suggestions.push('[TECH] 仅用了阴影+动画（最常见组合），缺少独特手法。考虑加：旋转/滤镜/渐变/图案/列布局');
        }
        if (newFp.fontFamily === 'monospace') {
            const monoCount = similarCards.filter(c => c.fp.fontFamily === 'monospace').length;
            if (monoCount >= 2) {
                suggestions.push('[FONT] 等宽字体在相似卡片中较多，考虑用衬线体或手写体做区分');
            }
        }
        if (newFp.layerCount <= 2) {
            suggestions.push('[LAYER] 视觉层较少，考虑加伪元素装饰线/标签/水印增加辨识度');
        }
        return suggestions;
    }

    // ========== 工程红线检查 ==========
    function checkRedLines(css, name) {
        const details = [];
        let passed = 0;
        const total = 7;

        // 红线1: .gallery-card 容器使用 position: fixed/absolute
        if (/\.gallery-card[^}]*position\s*:\s*(fixed|absolute)/i.test(css)) {
            details.push({ rule: '红线1', pass: false, msg: '.gallery-card 容器禁止使用 position:fixed/absolute' });
        } else {
            passed++;
            details.push({ rule: '红线1', pass: true, msg: '容器未使用 fixed/absolute' });
        }

        // 红线2: 修改 break-inside
        if (/break-inside\s*:/i.test(css)) {
            details.push({ rule: '红线2', pass: false, msg: '禁止修改 break-inside 属性' });
        } else {
            passed++;
            details.push({ rule: '红线2', pass: true, msg: '未修改 break-inside' });
        }

        // 红线3: CSS 原文包含 [data-cs="
        if (css.includes('[data-cs="')) {
            details.push({ rule: '红线3', pass: false, msg: '禁止在 CSS 原文中写 [data-cs="..." 前缀' });
        } else {
            passed++;
            details.push({ rule: '红线3', pass: true, msg: '未包含 [data-cs= 前缀' });
        }

        // 红线4: 子元素有非透明背景但容器无实色背景（简易检查）
        const containerHasBg = /\.gallery-card[^}]*(background|background-color)\s*:\s*[^;]+(?![a-zA-Z])/i.test(css);
        // 简化：暂不直接判失败
        passed++;
        details.push({ rule: '红线4', pass: true, msg: '容器背景检查（需人工复核）' });

        // 红线5: emoji 字符
        const emojiRe = /[\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}]/u;
        if (emojiRe.test(css)) {
            details.push({ rule: '红线5', pass: false, msg: '全属性禁止 emoji 字符' });
        } else {
            passed++;
            details.push({ rule: '红线5', pass: true, msg: '未检测到 emoji' });
        }

        // 红线6: hover 改变 margin/padding/width/height
        const hoverBadRe = /\.gallery-card[^}]*:hover[^}]*(margin|padding|width|height)\s*:/i;
        if (hoverBadRe.test(css)) {
            details.push({ rule: '红线6', pass: false, msg: 'hover 禁止改变 margin/padding/width/height' });
        } else {
            passed++;
            details.push({ rule: '红线6', pass: true, msg: 'hover 未改变文档流尺寸' });
        }

        // 红线7: 固定宽度 > 250px 可能导致 250px 下溢出
        const widthRe = /width\s*:\s*(\d+)px/gi;
        let m;
        let overflowRisk = false;
        while ((m = widthRe.exec(css)) !== null) {
            if (parseInt(m[1]) > 250) overflowRisk = true;
        }
        if (overflowRisk) {
            details.push({ rule: '红线7', pass: false, msg: '存在 width > 250px 的属性，250px 下可能溢出' });
        } else {
            passed++;
            details.push({ rule: '红线7', pass: true, msg: '未检测到固定宽度 > 250px' });
        }

        return { passed, total, details };
    }

    // ========== 质量打分（0-100） ==========
    function scoreQuality(css) {
        let score = 0;
        const details = [];

        // 1. 正文字号 >= 10px（20分）
        const fontSizeRe = /\.card-highlight-item[^}]*font-size\s*:\s*(\d+)px/i;
        const m = css.match(fontSizeRe);
        if (m && parseInt(m[1]) >= 10) {
            score += 20;
            details.push({ item: '正文字号', pass: true, msg: `font-size: ${m[1]}px ≥ 10px` });
        } else if (m) {
            details.push({ item: '正文字号', pass: false, msg: `font-size: ${m[1]}px < 10px` });
        } else {
            score += 20;
            details.push({ item: '正文字号', pass: true, msg: '未覆盖 .card-highlight-item 字号，使用基类' });
        }

        // 2. 装饰元素（伪元素）数量 ≤ 3（20分）
        const pseudoMatches = css.match(/::?(before|after)/gi) || [];
        const pseudoCount = new Set(pseudoMatches.map(s => s.toLowerCase())).size;
        if (pseudoCount <= 3) {
            score += 20;
            details.push({ item: '装饰数量', pass: true, msg: `伪元素种类 ${pseudoCount} 种 ≤ 3` });
        } else {
            details.push({ item: '装饰数量', pass: false, msg: `伪元素种类 ${pseudoCount} 种 > 3` });
        }

        // 3. 无 emoji（15分）
        const emojiRe = /[\u{1F600}-\u{1F64F}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}\u{FE00}-\u{FE0F}\u{1F900}-\u{1F9FF}]/u;
        if (!emojiRe.test(css)) {
            score += 15;
            details.push({ item: 'Emoji', pass: true, msg: '未检测到 emoji' });
        } else {
            details.push({ item: 'Emoji', pass: false, msg: '检测到 emoji 字符' });
        }

        // 4. hover 不改变文档流（15分）
        const hoverBadRe = /\.gallery-card[^}]*:hover[^}]*(margin|padding|width|height)\s*:/i;
        if (!hoverBadRe.test(css)) {
            score += 15;
            details.push({ item: 'Hover', pass: true, msg: 'hover 未改变文档流尺寸' });
        } else {
            details.push({ item: 'Hover', pass: false, msg: 'hover 改变了 margin/padding/width/height' });
        }

        // 5. 对比度（15分，简易）
        score += 15;
        details.push({ item: '对比度', pass: true, msg: '简易检查通过（需人工复核）' });

        // 6. 250px 不溢出（15分）
        const widthRe2 = /width\s*:\s*(\d+)px/gi;
        let overflowRisk = false;
        let m2;
        while ((m2 = widthRe2.exec(css)) !== null) {
            if (parseInt(m2[1]) > 250) overflowRisk = true;
        }
        if (!overflowRisk) {
            score += 15;
            details.push({ item: '250px溢出', pass: true, msg: '未检测到固定宽度 > 250px' });
        } else {
            details.push({ item: '250px溢出', pass: false, msg: '存在固定宽度 > 250px 的属性' });
        }

        return { score, details };
    }

    // ========== 差异度打分（视觉指纹，0-100，越高越独特） ==========
    function scoreDifference(css, name, allCards) {
        const newFp = extractFingerprint(css);
        let maxSim = 0;
        let mostSimilarName = '-';
        let mostSimilarFp = null;
        const comparisons = [];

        for (const row of allCards) {
            if (!row.card_css || row.name === name) continue;
            const fp = extractFingerprint(row.card_css);
            const sim = computeSimilarity(newFp, fp);
            comparisons.push({ name: row.name, fp, sim });
            if (sim > maxSim) {
                maxSim = sim;
                mostSimilarName = row.name;
                mostSimilarFp = fp;
            }
        }

        const diffScore = Math.round((1 - maxSim) * 100);
        const details = [];

        // 指纹摘要
        details.push({ item: '背景色系', pass: true, msg: newFp.bgFamily + (newFp.bgRaw ? ' (' + newFp.bgRaw.substring(0,30) + ')' : '') });
        details.push({ item: '字体族', pass: true, msg: newFp.fontFamily });
        const techs = Object.keys(newFp.features).filter(k => newFp.features[k]);
        details.push({ item: '视觉手法', pass: true, msg: techs.length > 0 ? techs.join(', ') : '无显著手法' });
        details.push({ item: '视觉层数', pass: true, msg: String(newFp.layerCount) });

        // 最相似对比
        details.push({ item: '最相似卡片', pass: diffScore >= 60, msg: '与「' + mostSimilarName + '」相似度 ' + (maxSim * 100).toFixed(1) + '%' });

        // 对比维度拆解
        if (mostSimilarFp) {
            details.push({ item: '-- 背景对比', pass: newFp.bgFamily !== mostSimilarFp.bgFamily, msg: newFp.bgFamily + ' vs ' + mostSimilarFp.bgFamily });
            details.push({ item: '-- 字体对比', pass: newFp.fontFamily !== mostSimilarFp.fontFamily, msg: newFp.fontFamily + ' vs ' + mostSimilarFp.fontFamily });
            const aTech = new Set(Object.keys(newFp.features).filter(k => newFp.features[k]));
            const bTech = new Set(Object.keys(mostSimilarFp.features).filter(k => mostSimilarFp.features[k]));
            const commonIgnore = new Set(['shadow', 'animation']);
            const aU = new Set([...aTech].filter(k => !commonIgnore.has(k)));
            const bU = new Set([...bTech].filter(k => !commonIgnore.has(k)));
            const overlap = new Set([...aU].filter(k => bU.has(k)));
            const uniqueA = new Set([...aU].filter(k => !bU.has(k)));
            details.push({ item: '-- 手法对比', pass: uniqueA.size > 0, msg: '重合' + overlap.size + '项 / 独有' + uniqueA.size + '项' });
        }

        // 差异化建议
        const similarCards = comparisons.filter(c => c.sim > 0.45);
        const suggestions = suggestDifferentiation(newFp, similarCards);

        return { score: diffScore, mostSimilar: mostSimilarName, details, suggestions };
    }

    // ========== 运行所有检查并更新 UI ==========
    async function runAllChecks() {
        const css = editor.value.trim();
        const name = select.value || currentName;
        if (!name || !css) {
            auditPanel.style.display = 'none';
            return;
        }
        auditPanel.style.display = 'block';

        // 红线检查
        const redResult = checkRedLines(css, name);
        redLineScore.textContent = redResult.passed + '/' + redResult.total;
        redLineResult.textContent = redResult.passed === redResult.total ? '通过' : '未通过';
        redLineResult.className = 'audit-result ' + (redResult.passed === redResult.total ? 'pass' : 'fail');
        redLineDetails.innerHTML = redResult.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.rule}: ${d.msg}</div>`).join('');

        // 质量打分
        const qualResult = scoreQuality(css);
        qualityScoreDisplay.textContent = qualResult.score;
        qualityNum.textContent = qualResult.score;
        qualityBar.style.width = qualResult.score + '%';
        qualityBar.className = 'score-fill ' + (qualResult.score >= 60 ? 'pass' : '');
        qualityResultEl.textContent = qualResult.score >= 60 ? '合格' : '待改进';
        qualityResultEl.className = 'audit-result ' + (qualResult.score >= 60 ? 'pass' : 'fail');
        qualityDetails.innerHTML = qualResult.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.item}: ${d.msg}</div>`).join('');

        // 差异度打分
        const diffData = scoreDifference(css, name, stylePoolData);
        diffScoreDisplay.textContent = diffData.score;
        diffNum.textContent = diffData.score;
        diffBar.style.width = diffData.score + '%';
        diffBar.className = 'score-fill ' + (diffData.score >= 60 ? 'pass' : '');
        diffAgainst.textContent = `(vs ${diffData.mostSimilar})`;
        diffResultEl.textContent = diffData.score >= 60 ? '合格' : '同质化风险';
        diffResultEl.className = 'audit-result ' + (diffData.score >= 60 ? 'pass' : 'fail');
        diffDetails.innerHTML = diffData.details.map(d => `<div class="audit-detail-item ${d.pass ? 'pass' : 'fail'}">${d.item}: ${d.msg}</div>`).join('');

        // 差异化建议
        if (diffData.suggestions && diffData.suggestions.length > 0) {
            suggestPanel.style.display = 'block';
            suggestContent.innerHTML = diffData.suggestions.map(s => '<div class="suggest-item">' + s + '</div>').join('');
        } else {
            suggestPanel.style.display = 'none';
        }

        // 保存按钮状态
        const canSave = (redResult.passed === redResult.total) && diffData.score >= 60;
        btnSave.disabled = !canSave;
    }

    // ========== 构建预览卡片 ==========
    function buildPreview(name, css) {
        let styleEl = document.getElementById('preview-dynamic-css');
        if (styleEl) styleEl.remove();
        if (css) {
            styleEl = document.createElement('style');
            styleEl.id = 'preview-dynamic-css';
            styleEl.textContent = scopeCSS(css, name);
            document.head.appendChild(styleEl);
        }

        const dummyDiary = {
            id: 9999,
            title: '预览标题 · 示例日记',
            date: '2026/06/13',
            dateRaw: '2026-06-13',
            highlights: [
                '这是第一条精华句，用于预览卡片样式效果。',
                '这是第二条精华句，测试多句之间的分隔符样式。',
                '第三条，展示更多内容时的排版表现。'
            ],
            cardType: 'custom',
            capsuleName: name,
            capsuleCSS: css
        };

        previewArea.innerHTML = '<div style="text-align:center;margin-bottom:12px;font-size:10px;color:var(--pixel-dim);">' + escapeHtml(name) + ' · ' + (currentCat || '?') + (currentDesc ? ' · ' + currentDesc : '') + '</div>';
        previewArea.insertAdjacentHTML('beforeend', renderCard(dummyDiary));
    }

    // ========== 加载 STYLE_POOL 列表 ==========
    async function loadPool() {
        const { data, error } = await supabase.from('STYLE_POOL').select('name, category, desc, card_css').order('name');
        if (error) {
            setStatus('加载失败: ' + error.message, false);
            return;
        }
        stylePoolData = data || [];
        select.innerHTML = '<option value="">-- 选择扭蛋 (' + stylePoolData.length + ' 个) --</option>';
        stylePoolData.forEach(row => {
            const hasCSS = row.card_css ? ' [已设计]' : '';
            select.innerHTML += `<option value="${escapeHtml(row.name)}">${escapeHtml(row.name)}${hasCSS}</option>`;
        });
        setStatus(`已加载 ${stylePoolData.length} 个扭蛋`, true);
    }

    // ========== 事件绑定 ==========

    // 加载选中扭蛋的 card_css
    btnLoad.addEventListener('click', () => {
        const name = select.value;
        if (!name) { setStatus('请先选择一个扭蛋', false); return; }
        const row = stylePoolData.find(r => r.name === name);
        if (!row) { setStatus('未找到该扭蛋', false); return; }
        currentName = name;
        currentCSS = row.card_css || null;
        currentDesc = row.desc || '';
        currentCat = row.category || '';
        editor.value = currentCSS || '';
        infoDesc.textContent = currentDesc || '(无)';
        infoCat.textContent = currentCat || '(无)';
        infoPanel.classList.add('show');
        setStatus(`已加载: ${name}` + (currentCSS ? ' (已有设计)' : ' (空白)'), true);
        // 自动运行检查
        if (currentCSS) runAllChecks();
    });

    // 预览（自动规范化 + 审核）
    btnPreview.addEventListener('click', () => {
        const css = editor.value.trim();
        const name = select.value || currentName;
        if (!name) { setStatus('请先选择扭蛋', false); return; }
        // 自动规范化
        const normCSS = normalizeCSS(css);
        if (normCSS !== css) {
            editor.value = normCSS;
            setStatus('已自动规范化 CSS', true);
        }
        // 运行审核
        runAllChecks();
        // 构建预览
        buildPreview(name, normCSS.trim());
        setStatus('预览已更新' + (normCSS !== css ? '（已规范化）' : ''), true);
    });

    // 保存到 Supabase（需通过审核）
    btnSave.addEventListener('click', async () => {
        const name = select.value || currentName;
        if (!name) { setStatus('请先选择扭蛋', false); return; }
        if (btnSave.disabled) {
            setStatus('未通过审核，无法保存（需红线全过 + 差异度≥60%）', false);
            return;
        }
        const css = normalizeCSS(editor.value.trim());
        const { error } = await supabase
            .from('STYLE_POOL')
            .update({ card_css: css || null })
            .eq('name', name);
        if (error) {
            setStatus('保存失败: ' + error.message, false);
        } else {
            currentCSS = css || null;
            const row = stylePoolData.find(r => r.name === name);
            if (row) row.card_css = css || null;
            const opt = select.querySelector(`option[value="${name.replace(/"/g, '&quot;')}"]`);
            if (opt) opt.textContent = name + (css ? ' [已设计]' : '');
            setStatus('已保存: ' + name, true);
        }
    });

    // 规范化按钮
    btnNormalize.addEventListener('click', () => {
        const css = editor.value.trim();
        if (!css) { setStatus('编辑区为空', false); return; }
        const normCSS = normalizeCSS(css);
        editor.value = normCSS;
        runAllChecks();
        setStatus('已规范化 CSS', true);
    });

    // 修改时实时预览 + 审核
    let previewTimer;
    editor.addEventListener('input', () => {
        clearTimeout(previewTimer);
        previewTimer = setTimeout(() => {
            const css = editor.value.trim();
            const name = select.value || currentName;
            if (name && css) {
                runAllChecks();
                buildPreview(name, css);
                setStatus('实时预览中...', true);
            }
        }, 800);
    });

    // 切换扭蛋时自动加载
    select.addEventListener('change', () => {
        btnLoad.click();
    });

    // 清空编辑区
    btnClear.addEventListener('click', () => {
        editor.value = '';
        setStatus('编辑区已清空', true);
    });

    // 复制信息
    btnCopyInfo.addEventListener('click', () => {
        const text = `扭蛋名: ${currentName || '-'}\n描述: ${currentDesc || '-'}\n分类: ${currentCat || '-'}`;
        navigator.clipboard.writeText(text).then(() => {
            setStatus('已复制到剪贴板', true);
        }).catch(() => {
            setStatus('复制失败', false);
        });
    });

    // 重置
    btnReset.addEventListener('click', () => {
        editor.value = currentCSS || '';
        runAllChecks();
        buildPreview(currentName, currentCSS || null);
        setStatus('已重置', true);
    });

    // ========== 初始化 ==========
    async function init() {
        const authed = await checkAuth();
        if (!authed) return;
        await loadPool();
    }
    init();
</script>
