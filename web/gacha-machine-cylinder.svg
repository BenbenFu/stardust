<!--
  扭蛋机剪影 #2 — Cylinder (蒸汽管型)
  ========================================
  分配给：NO.03(tech), NO.06(social), NO.09(roleplay), NO.12(misc)

  === 绘制约束 (必读) ===

  1. 画布
     viewBox="0 0 200 280"，CSS 容器 160×230(桌面)/135×195(平板)/110×165(手机)

  2. 色彩约束 — 仅 #1e2622，通过透明度制造轻重层次
     rgba(30,38,34,0.12)  — 最深，结构性色块、实体面板
     rgba(30,38,34,0.07)  — 中等，机身面板、滚筒底色
     rgba(30,38,34,0.03)  — 浅，过渡面
     ★ 不要引入任何其他颜色！单色多透明度制造像素风的"灰阶"层次。

  3. 结构层次
     - 顶部：蒸汽管道 + 压力表装饰
     - 中段：圆柱机身外壳 → 胶囊滚筒(内部) → 滚筒周边框架
     - 下半身：封闭式前面板(填充0.12)覆盖内部滑道 → 梯形/矩形底座
     - 胶囊出口是前面板上的横向窄槽
     ★ 内部滑道被外壳遮挡，不画裸露滑道！

  4. 必须保留的动画节点（class + CSS变量）
     class="gba-svg-knob"    style="--knob-cx:Npx;--knob-cy:Npx"
     class="gba-svg-drum"    style="--drum-cx:Npx;--drum-cy:Npx"
     class="gba-svg-capsule" style="--capsule-cx:Npx;--capsule-cy:Npx" ×6颗
     class="gba-svg-prize"   style="--prize-cx:Npx;--prize-cy:Npx"

  5. 胶囊：6颗，散布滚筒内无重叠，各有nth-child序号

  6. 不画：背景色/<html>/<body>/emoji/文字/裸露管道
-->
<svg class="gba-machine-svg" viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <pattern id="lcd-grid-c" width="4" height="4" patternUnits="userSpaceOnUse">
            <rect width="4" height="4" fill="none"/>
            <rect width="1" height="1" fill="rgba(30,38,34,0.06)"/>
        </pattern>
    </defs>

    <!-- ═══ 顶部：蒸汽管道系统 ═══ -->
    <!-- 管顶椭圆 -->
    <ellipse cx="100" cy="48" rx="44" ry="16" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="2.5"/>
    <!-- 竖直蒸汽管 -->
    <rect x="94" y="28" width="12" height="24" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
    <!-- 压力表 -->
    <circle cx="100" cy="26" r="7" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="2"/>
    <line x1="100" y1="20" x2="100" y2="32" stroke="#1e2622" stroke-width="1"/>
    <line x1="94" y1="26" x2="106" y2="26" stroke="#1e2622" stroke-width="1"/>
    <!-- 排气管弯头 -->
    <path d="M 100 28 L 100 16 L 118 16" fill="none" stroke="#1e2622" stroke-width="2" stroke-linecap="round"/>
    <!-- 蒸汽逸出 -->
    <path d="M 115 9 Q 118 6 120 9 M 117 5 Q 120 2 122 5" fill="none" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 管顶铆钉 -->
    <circle cx="65" cy="48" r="2" fill="#1e2622"/>
    <circle cx="135" cy="48" r="2" fill="#1e2622"/>

    <!-- ═══ 中段上：圆柱机身外壳 ═══ -->
    <rect x="48" y="62" width="104" height="118" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="3"/>
    <!-- 机身上横线 -->
    <line x1="48" y1="78" x2="152" y2="78" stroke="#1e2622" stroke-width="1.5" stroke-dasharray="3,5"/>
    <!-- 机身侧铆钉 -->
    <circle cx="58" cy="74" r="2" fill="#1e2622"/>
    <circle cx="142" cy="74" r="2" fill="#1e2622"/>

    <!-- ═══ 胶囊滚筒 (旋转中心: 100,130) ═══ -->
    <g class="gba-svg-drum" style="--drum-cx:100px;--drum-cy:130px;">
        <!-- 滚筒底色 -->
        <rect x="60" y="82" width="80" height="82" rx="2" fill="rgba(30,38,34,0.03)"/>
        <!-- 滚筒边框 -->
        <rect x="60" y="82" width="80" height="82" rx="2" fill="none" stroke="#1e2622" stroke-width="2"/>
        <!-- 水平分隔 -->
        <line x1="60" y1="96" x2="140" y2="96" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,3"/>
        <line x1="60" y1="110" x2="140" y2="110" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,3"/>
        <line x1="60" y1="124" x2="140" y2="124" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,3"/>
        <line x1="60" y1="138" x2="140" y2="138" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,3"/>
        <line x1="60" y1="152" x2="140" y2="152" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,3"/>

        <!-- 胶囊 #1 -->
        <g class="gba-svg-capsule" style="--capsule-cx:76px;--capsule-cy:90px;">
            <circle cx="76" cy="90" r="6" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #2 -->
        <g class="gba-svg-capsule" style="--capsule-cx:120px;--capsule-cy:92px;">
            <circle cx="120" cy="92" r="7" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #3 -->
        <g class="gba-svg-capsule" style="--capsule-cx:88px;--capsule-cy:118px;">
            <circle cx="88" cy="118" r="6" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #4 -->
        <g class="gba-svg-capsule" style="--capsule-cx:110px;--capsule-cy:130px;">
            <circle cx="110" cy="130" r="7" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #5 -->
        <g class="gba-svg-capsule" style="--capsule-cx:84px;--capsule-cy:144px;">
            <circle cx="84" cy="144" r="7" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
        <!-- 胶囊 #6 -->
        <g class="gba-svg-capsule" style="--capsule-cx:116px;--capsule-cy:154px;">
            <circle cx="116" cy="154" r="5" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="1.5"/>
        </g>
    </g>

    <!-- ═══ 下半身：封闭式前面板 ═══ -->
    <rect x="44" y="180" width="112" height="44" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="2.5"/>
    <!-- 面板横线 -->
    <line x1="44" y1="194" x2="156" y2="194" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 胶囊出口 (横槽) -->
    <rect x="70" y="198" width="60" height="5" rx="1" fill="rgba(30,38,34,0.03)" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 面板装饰 -->
    <line x1="58" y1="208" x2="142" y2="208" stroke="#1e2622" stroke-width="1" stroke-dasharray="2,4"/>

    <!-- 奖品出口 (掉落起点: 100,203) -->
    <g class="gba-svg-prize" style="--prize-cx:100px;--prize-cy:203px;">
        <circle cx="100" cy="203" r="5" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2"/>
    </g>

    <!-- ═══ 底座 (梯形) ═══ -->
    <path d="M 38 226 L 162 226 L 150 258 L 50 258 Z" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="3"/>
    <line x1="48" y1="242" x2="152" y2="242" stroke="#1e2622" stroke-width="1.5"/>
    <!-- 底座脚垫 -->
    <rect x="58" y="258" width="20" height="5" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>
    <rect x="122" y="258" width="20" height="5" fill="rgba(30,38,34,0.12)" stroke="#1e2622" stroke-width="1.5"/>

    <!-- ═══ 摇把 (旋转中心: 170,100) — 右侧中上 ═══ -->
    <g class="gba-svg-knob" style="--knob-cx:170px;--knob-cy:100px;">
        <line x1="152" y1="100" x2="162" y2="100" stroke="#1e2622" stroke-width="4" stroke-linecap="round"/>
        <circle cx="170" cy="100" r="10" fill="rgba(30,38,34,0.07)" stroke="#1e2622" stroke-width="2.5"/>
        <circle cx="170" cy="100" r="3" fill="#1e2622"/>
        <line x1="162" y1="100" x2="178" y2="100" stroke="#1e2622" stroke-width="1.5"/>
        <line x1="170" y1="92" x2="170" y2="108" stroke="#1e2622" stroke-width="1.5"/>
    </g>
</svg>
