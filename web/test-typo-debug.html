<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Typo Debug Test</title>
</head>
<body>
<h2>Typo Debug — verify data attrs + CSS</h2>
<div id="app"></div>
<pre id="debug"></pre>
<script type="module">
import { injectBaseCss, injectDynamicStyles, renderStyleJson, DEFAULT_STYLE_JSON } from './style-engine.js?v=20260708a';

injectBaseCss();

// Mock typo CSS templates (same as DB)
const mockTypo = [
  { css_template: '.gallery-card[data-style-typo-weight-gradient="balanced"] { --typo-title-weight:600; --typo-date-weight:400; --typo-highlight-weight:400; --typo-capsule-weight:500; }' },
  { css_template: '.gallery-card[data-style-typo-weight-gradient="bold_heavy"] { --typo-title-weight:800; --typo-date-weight:500; --typo-highlight-weight:500; --typo-capsule-weight:700; }' },
  { css_template: '.gallery-card[data-style-typo-size-scale="balanced_read"] { --typo-title-scale:1.5; --typo-date-scale:0.85; --typo-highlight-scale:1.0; --typo-capsule-scale:0.9; }' },
  { css_template: '.gallery-card[data-style-typo-size-scale="compact_dense"] { --typo-title-scale:1.2; --typo-date-scale:0.8; --typo-highlight-scale:0.9; --typo-capsule-scale:0.8; }' },
  { css_template: '.gallery-card[data-style-typo-alignment-mode="left_flow"] { --typo-title-align:left; --typo-date-align:left; --typo-highlight-align:left; --typo-capsule-align:left; }' },
  { css_template: '.gallery-card[data-style-typo-alignment-mode="centered_formal"] { --typo-title-align:center; --typo-date-align:center; --typo-highlight-align:center; --typo-capsule-align:center; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-title="system_sans"] .card-title { font-family: system-ui, sans-serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-title="editorial_serif"] .card-title { font-family: Georgia, "Times New Roman", serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-date="system_sans"] .card-date { font-family: system-ui, sans-serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-date="editorial_serif"] .card-date { font-family: Georgia, serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-capsule="system_sans"] .card-capsule { font-family: system-ui, sans-serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-capsule="editorial_serif"] .card-capsule { font-family: Georgia, serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-highlight="system_sans"] .card-highlight-item { font-family: system-ui, sans-serif; }' },
  { css_template: '.gallery-card[data-style-typo-font-family-highlight="editorial_serif"] .card-highlight-item { font-family: Georgia, serif; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-title="normal"] .card-title { line-height: 1.4; letter-spacing: 0; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-title="dense"] .card-title { line-height: 1.1; letter-spacing: -0.04em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-title="loose"] .card-title { line-height: 1.8; letter-spacing: 0.05em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-date="normal"] .card-date { line-height: 1.4; letter-spacing: 0; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-date="dense"] .card-date { line-height: 1.1; letter-spacing: -0.04em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-date="loose"] .card-date { line-height: 1.8; letter-spacing: 0.05em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-capsule="normal"] .card-capsule { line-height: 1.4; letter-spacing: 0; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-capsule="dense"] .card-capsule { line-height: 1.1; letter-spacing: -0.04em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-capsule="loose"] .card-capsule { line-height: 1.8; letter-spacing: 0.05em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-highlight="normal"] .card-highlight-item { line-height: 1.4; letter-spacing: 0; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-highlight="dense"] .card-highlight-item { line-height: 1.1; letter-spacing: -0.04em; }' },
  { css_template: '.gallery-card[data-style-typo-spacing-tightness-highlight="loose"] .card-highlight-item { line-height: 1.8; letter-spacing: 0.05em; }' },
];

injectDynamicStyles({ typo: mockTypo });

const diary = {
  id: 1, date: '2026/07/08', dateRaw: '2026-07-08',
  title: 'Typo Debug Test Title',
  highlights: ['First highlight line', 'Second highlight line'],
  capsuleName: 'TestCapsule'
};

const app = document.getElementById('app');
const debug = document.getElementById('debug');
const allOptions = { typo: mockTypo, palette: [], layout: [], border: [], deco: [], effect: [], element: [], container_group: [] };

// Test 1: Default
let sj1 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj1.typo.font_family = { title:'system_sans', date:'system_sans', capsule:'system_sans', highlights:'system_sans' };

// Test 2: Change weight_gradient to bold_heavy
let sj2 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj2.typo.weight_gradient = 'bold_heavy';

// Test 3: Change size_scale to compact_dense
let sj3 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj3.typo.size_scale = 'compact_dense';

// Test 4: Change alignment_mode to centered_formal
let sj4 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj4.typo.alignment_mode = 'centered_formal';

// Test 5: Change font_family to editorial_serif
let sj5 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj5.typo.font_family = { title:'editorial_serif', date:'editorial_serif', capsule:'editorial_serif', highlights:'editorial_serif' };

// Test 6: Change spacing_tightness to dense
let sj6 = JSON.parse(JSON.stringify(DEFAULT_STYLE_JSON));
sj6.typo.spacing_tightness = { title:'dense', date:'dense', capsule:'dense', highlights:'dense' };

const tests = [
  { label: '1. Default (system_sans, balanced, balanced_read, left_flow)', sj: sj1 },
  { label: '2. weight_gradient=bold_heavy (expect: heavier font)', sj: sj2 },
  { label: '3. size_scale=compact_dense (expect: smaller font)', sj: sj3 },
  { label: '4. alignment_mode=centered_formal (expect: centered text)', sj: sj4 },
  { label: '5. font_family=editorial_serif (expect: serif font)', sj: sj5 },
  { label: '6. spacing_tightness=dense (expect: tight letter-spacing)', sj: sj6 },
];

let html = '';
let debugLog = '';

tests.forEach(t => {
  const cardHtml = renderStyleJson(t.sj, diary, allOptions);
  html += '<div style="margin-bottom:20px;"><div style="font-size:11px;color:#666;margin-bottom:4px;">' + t.label + '</div>' + cardHtml + '</div>';
  
  // Extract data attrs from cardHtml
  const match = cardHtml.match(/class="gallery-card"([^>]*)/);
  debugLog += t.label + '\n  data-attrs: ' + (match ? match[1].trim() : 'NOT FOUND') + '\n\n';
});

app.innerHTML = html;
debug.textContent = debugLog;

// Also check what CSS was injected
const dynCss = document.getElementById('card-engine-dynamic-css');
debug.textContent += '\n--- Injected Dynamic CSS (first 500 chars) ---\n';
debug.textContent += dynCss ? dynCss.textContent.substring(0, 500) : 'NOT FOUND';
</script>
</body>
</html>
